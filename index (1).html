  const input = h("input", { id, class: "field__control is-amount", name, inputmode: "numeric", placeholder, autocomplete: "off", dir: "ltr" });
  const box = h("div", { class: "field__suffix" }, input, h("span", null, suffix));
  const { el, setError } = wrap({ label, required, hint }, box, id);
  const set = (v) => { input.value = v == null ? "" : formatAmountInput(String(v)); };
  set(value);
  input.addEventListener("input", () => {
    input.value = formatAmountInput(input.value);
    setError("");
  });
  return { name, el, input, setError, set, get: () => parseAmount(input.value) };
}

/** تاریخ شمسی با انتخابگر؛ get() → ISO یا null */
function dateField({ name, label, value = null, required, hint, allowClear = !required, title }) {
  const id = "f" + ++uid;
  let current = value;
  const text = h("span", { class: "date-btn__text" });
  const btn = h("button", { id, type: "button", class: "field__control date-btn" }, icon("calendar", 20), text);
  const { el, setError } = wrap({ label, required, hint }, btn, id);
  const paint = () => {
    text.textContent = current ? formatJalali(current, "long") : "انتخاب تاریخ";
    text.classList.toggle("is-placeholder", !current);
  };
  paint();
  btn.addEventListener("click", async () => {
    const r = await pickDate({ value: current, title: title || label || "انتخاب تاریخ", allowClear });
    if (r === undefined) return;
    current = r; paint(); setError("");
  });
  return { name, el, setError, get: () => current, set: (v) => { current = v || null; paint(); } };
}

function selectField({ name, label, options, value = "", required, hint, placeholder }) {
  const id = "f" + ++uid;
  const sel = h("select", { id, class: "field__control", name },
    placeholder ? h("option", { value: "" }, placeholder) : null,
    ...options.map((o) => h("option", { value: String(o.value) }, o.label)));
  sel.value = String(value ?? "");
  const { el, setError } = wrap({ label, required, hint }, sel, id);
  sel.addEventListener("change", () => setError(""));
  return { name, el, input: sel, setError, get: () => sel.value, set: (v) => { sel.value = String(v ?? ""); } };
}

/** انتخاب یکی از چند گزینه با دکمه‌های کنار هم */
function segmentedField({ name, label, options, value, onChange }) {
  let current = value ?? options[0].value;
  const btns = options.map((o) => h("button", { type: "button", dataset: { v: o.value }, onClick: () => set(o.value, true) }, o.label));
  const seg = h("div", { class: "segmented", role: "group" }, ...btns);
  const { el, setError } = wrap({ label }, seg, null);
  function set(v, fire = false) {
    current = v;
    btns.forEach((b) => b.classList.toggle("is-active", b.dataset.v === String(v)));
    if (fire) onChange?.(v);
  }
  set(current);
  return { name, el, setError, set, get: () => current };
}

/** نمایش خطاهای اعتبارسنجی {نام فیلد: پیام} روی فیلدها؛ true اگر خطایی روی فیلدی نشست */
function showErrors(fields, errors = {}) {
  let first = null, shown = false;
  for (const f of fields) {
    const msg = errors[f.name];
    f.setError?.(msg || "");
    if (msg) { shown = true; first ??= f; }
  }
  first?.el.scrollIntoView?.({ block: "center", behavior: "smooth" });
  return shown;
}



return { textField, amountField, dateField, selectField, segmentedField, showErrors, toEnglishDigits };
},
"js/ui/datepicker.js": () => {
/** datepicker.js — انتخابگر تاریخ شمسی (Bottom Sheet). خروجی: ISO میلادی یا null */
const { h } = __r("js/ui/dom.js");
const { icon } = __r("js/ui/icons.js");
const { openSheet } = __r("js/ui/modal.js");
const { MONTH_NAMES, WEEKDAY_SHORT, isoToJalali, jalaliToISO, jalaliMonthLength, weekdayIndex, todayISO } = __r("js/core/jalali.js");
const { toPersianDigits } = __r("js/core/money.js");

/**
 * @param {{value?: string|null, title?: string, allowClear?: boolean}} opts
 * @returns {Promise<string|null|undefined>} ISO انتخابی | null (پاک‌شد) | undefined (انصراف)
 */
function pickDate({ value = null, title = "انتخاب تاریخ", allowClear = false } = {}) {
  const today = todayISO();
  const start = isoToJalali(value || today);
  let { jy, jm } = start;
  const selected = value;
  const body = h("div");
  const ctl = openSheet(body);

  function render() {
    const len = jalaliMonthLength(jy, jm);
    const offset = weekdayIndex(jalaliToISO(jy, jm, 1)); // شنبه=۰
    const cells = [];
    for (let i = 0; i < offset; i++) cells.push(h("span", { class: "dp__cell dp__cell--empty" }));
    for (let d = 1; d <= len; d++) {
      const iso = jalaliToISO(jy, jm, d);
      cells.push(h("button", {
        type: "button",
        class: "dp__cell" + (iso === selected ? " is-selected" : "") + (iso === today ? " is-today" : ""),
        "aria-label": `${d} ${MONTH_NAMES[jm - 1]} ${jy}`,
        onClick: () => ctl.close(iso),
      }, toPersianDigits(d)));
    }
    const step = (delta) => { jm += delta; if (jm > 12) { jm = 1; jy++; } if (jm < 1) { jm = 12; jy--; } render(); };
    body.replaceChildren(
      h("h3", { class: "sheet__title" }, title),
      h("div", { class: "dp__nav" },
        // در RTL: دکمه سمت راست = ماه قبل
        h("button", { type: "button", class: "icon-btn", "aria-label": "ماه قبل", onClick: () => step(-1) }, icon("chevron-right")),
        h("div", { class: "dp__title" }, `${MONTH_NAMES[jm - 1]} ${toPersianDigits(jy)}`),
        h("button", { type: "button", class: "icon-btn", "aria-label": "ماه بعد", onClick: () => step(1) }, icon("chevron-left")),
      ),
      h("div", { class: "dp__grid dp__week" }, ...WEEKDAY_SHORT.map((w) => h("span", null, w))),
      h("div", { class: "dp__grid" }, ...cells),
      h("div", { class: "sheet__actions" },
        h("button", { type: "button", class: "btn btn--ghost", onClick: () => ctl.close(undefined) }, "انصراف"),
        allowClear ? h("button", { type: "button", class: "btn btn--ghost", onClick: () => ctl.close(null) }, "پاک کردن") : null,
        h("button", { type: "button", class: "btn btn--primary", onClick: () => ctl.close(today) }, "امروز"),
      ),
    );
  }
  render();
  return ctl.closed;
}

return { pickDate };
},
"js/core/followups.js": () => {
/** followups.js — پیگیری تسویه (ثبت تماس، وعده پرداخت، پیگیری بعدی) */
const { withTx, logActivity } = __r("js/core/db.js");
const { AppError } = __r("js/core/util.js");
const { formatJalali } = __r("js/core/jalali.js");

const OUTCOMES = {
  answered: "پاسخ داد",
  no_answer: "پاسخ نداد",
  promised: "وعده پرداخت داد",
  recall: "درخواست تماس مجدد",
  settled: "اعلام کرد تسویه شده",
};
const isISO = (s) => !s || /^\d{4}-\d{2}-\d{2}$/.test(s);
const fail = (field, msg) => new AppError("validation", msg, { [field]: msg });

async function addFollowup({ customerId, projectId = null, contactDate, outcome, promiseAmount = null, promiseDate = null, note = "", nextFollowUpDate = null }) {
  if (!Number.isSafeInteger(customerId)) throw fail("customerId", "مشتری را انتخاب کنید.");
  if (!contactDate || !isISO(contactDate)) throw fail("contactDate", "تاریخ تماس را انتخاب کنید.");
  if (!(outcome in OUTCOMES)) throw fail("outcome", "نتیجه تماس را انتخاب کنید.");
  if (promiseAmount !== null && (!Number.isSafeInteger(promiseAmount) || promiseAmount <= 0)) throw fail("promiseAmount", "مبلغ وعده نامعتبر است.");
  if (!isISO(promiseDate)) throw fail("promiseDate", "تاریخ وعده نامعتبر است.");
  if (!isISO(nextFollowUpDate)) throw fail("nextFollowUpDate", "تاریخ پیگیری بعدی نامعتبر است.");
  if (nextFollowUpDate && nextFollowUpDate < contactDate) throw fail("nextFollowUpDate", "پیگیری بعدی نباید قبل از تاریخ تماس باشد.");
  return withTx(["customers", "followups", "activity"], "readwrite", async (s) => {
    const c = await s.customers.get(customerId);
    if (!c) throw new AppError("not-found", "مشتری پیدا نشد.");
    // با ثبت تماس جدید، پیگیری‌های بازِ قبلیِ همان مشتری که موعدشان رسیده بسته می‌شوند
    for (const f of await s.followups.getAllByIndex("customerId", customerId)) {
      if (!f.done && f.nextFollowUpDate && f.nextFollowUpDate <= contactDate) await s.followups.put({ ...f, done: 1 });
    }
    const rec = await s.followups.add({
      customerId, projectId, contactDate, outcome, promiseAmount, promiseDate,
      note: String(note ?? "").trim(), nextFollowUpDate: nextFollowUpDate || null, done: nextFollowUpDate ? 0 : 1,
    });
    await logActivity(s, { entity: "followup", entityId: rec.id, action: "create", summary: `تماس با «${c.name}» (${formatJalali(contactDate, "long")}): ${OUTCOMES[outcome]}` });
    return rec;
  });
}

async function markFollowupDone(id) {
  return withTx(["followups", "activity"], "readwrite", async (s) => {
    const f = await s.followups.get(id);
    if (!f) throw new AppError("not-found", "پیگیری پیدا نشد.");
    const rec = await s.followups.put({ ...f, done: 1 });
    await logActivity(s, { entity: "followup", entityId: id, action: "done", summary: "پیگیری انجام‌شده علامت خورد" });
    return rec;
  });
}

async function listFollowups({ customerId } = {}) {
  const rows = await withTx("followups", "readonly", (s) => (customerId ? s.followups.getAllByIndex("customerId", customerId) : s.followups.getAll()));
  return rows.sort((a, b) => (a.contactDate === b.contactDate ? b.id - a.id : a.contactDate < b.contactDate ? 1 : -1));
}

return { OUTCOMES, addFollowup, markFollowupDone, listFollowups };
},
"js/core/customers.js": () => {
/** customers.js — دسترسی به داده مشتریان (بدون UI) */
const { withTx, logActivity, getAll } = __r("js/core/db.js");
const { AppError, normalizeText, normalizePhone } = __r("js/core/util.js");
const { validateCustomer } = __r("js/core/rules.js");
const { todayISO } = __r("js/core/jalali.js");

function failValidation(errors) {
  return new AppError("validation", Object.values(errors)[0], errors);
}

/** ثبت مشتری؛ نام تکراری (پس از نرمال‌سازی) رد می‌شود */
async function createCustomer(input) {
  const v = validateCustomer({ ...input, firstCollabDate: input.firstCollabDate || todayISO() });
  if (!v.ok) throw failValidation(v.errors);
  try {
    return await withTx(["customers", "activity"], "readwrite", async (s) => {
      const c = await s.customers.add(v.value);
      await logActivity(s, { entity: "customer", entityId: c.id, action: "create", summary: `مشتری «${c.name}» ثبت شد` });
      return c;
    });
  } catch (e) {
    if (e.code === "duplicate") throw new AppError("duplicate", "مشتری با این نام قبلاً ثبت شده است.", { name: "مشتری با این نام قبلاً ثبت شده است." });
    throw e;
  }
}

async function updateCustomer(id, input) {
  const v = validateCustomer(input);
  if (!v.ok) throw failValidation(v.errors);
  try {
    return await withTx(["customers", "activity"], "readwrite", async (s) => {
      const old = await s.customers.get(id);
      if (!old) throw new AppError("not-found", "مشتری پیدا نشد.");
      const c = await s.customers.put({ ...old, ...v.value });
      await logActivity(s, { entity: "customer", entityId: id, action: "update", summary: `اطلاعات «${c.name}» ویرایش شد` });
      return c;
    });
  } catch (e) {
    if (e.code === "duplicate") throw new AppError("duplicate", "مشتری دیگری با این نام وجود دارد.", { name: "مشتری دیگری با این نام وجود دارد." });
    throw e;
  }
}

const getCustomer = (id) => withTx("customers", "readonly", (s) => s.customers.get(id));

/** فهرست مشتریان؛ q روی نام (نرمال‌شده) و شماره تماس جست‌وجو می‌کند */
async function listCustomers({ q = "" } = {}) {
  const all = await getAll("customers");
  const key = normalizeText(q);
  const digits = normalizePhone(q);
  const out = key
    ? all.filter((c) => c.nameKey.includes(key) || (digits.length >= 3 && (c.phone || "").includes(digits)))
    : all;
  return out.sort((a, b) => a.name.localeCompare(b.name, "fa"));
}

/** حذف فقط وقتی مشتری هیچ پروژه‌ای ندارد */
async function deleteCustomer(id) {
  return withTx(["customers", "projects", "followups", "activity"], "readwrite", async (s) => {
    const c = await s.customers.get(id);
    if (!c) return false;
    if ((await s.projects.countByIndex("customerId", id)) > 0)
      throw new AppError("has-data", "این مشتری پروژه ثبت‌شده دارد و حذف نمی‌شود.");
    if ((await s.followups.countByIndex("customerId", id)) > 0)
      throw new AppError("has-data", "این مشتری سابقه پیگیری دارد و حذف نمی‌شود.");
    await s.customers.delete(id);
    await logActivity(s, { entity: "customer", entityId: id, action: "delete", summary: `مشتری «${c.name}» حذف شد` });
    return true;
  });
}

return { createCustomer, updateCustomer, getCustomer, listCustomers, deleteCustomer };
},

        });
        toastSuccess("پیگیری ثبت شد"); ctl.close(r);
      } catch (e) { if (e.code === "validation") showErrors(Object.values(f), e.cause ?? {}); else toastError(e.message || "ثبت نشد"); }

"js/core/projects.js": () => {
/** projects.js — پروژه‌ها و نرخ روزمزدی تاریخ‌دار (بدون UI) */
const { withTx, logActivity, getAll } = __r("js/core/db.js");
const { AppError, normalizeText } = __r("js/core/util.js");
const { validateProject } = __r("js/core/rules.js");
const { todayISO } = __r("js/core/jalali.js");
const { PROJECT_TYPES, PROJECT_STATUS } = __r("js/core/constants.js");

const failValidation = (errors) => new AppError("validation", Object.values(errors)[0], errors);
const isPosInt = (n) => Number.isSafeInteger(n) && n > 0;

/**
 * ساخت پروژه. برای روزمزدی، نرخ اولیه در «همان تراکنش» ثبت می‌شود
 * (یا هر دو ذخیره می‌شوند یا هیچ‌کدام).
 * input.dailyRate / input.rateFrom فقط برای type=daily
 */
async function createProject(input) {
  const data = { status: "planned", progress: 0, ...input };
  const v = validateProject(data, { isNew: true });
  if (!v.ok) throw failValidation(v.errors);
  return withTx(["projects", "dailyRates", "customers", "activity"], "readwrite", async (s) => {
    const cust = await s.customers.get(v.value.customerId);
    if (!cust) throw new AppError("not-found", "مشتری انتخاب‌شده پیدا نشد.");
    const p = await s.projects.add(v.value);
    if (p.type === "daily") {
      await s.dailyRates.add({ projectId: p.id, effectiveFrom: data.rateFrom || p.startDate || todayISO(), amount: data.dailyRate });
    }
    await logActivity(s, { entity: "project", entityId: p.id, action: "create", summary: `پروژه «${p.name}» برای «${cust.name}» ثبت شد` });
    return p;
  });
}

/**
 * ویرایش پروژه. نوع همکاری (روزمزدی/پروژه‌ای) بعد از ساخت تغییر نمی‌کند
 * (تغییرش سوابق مالی را بی‌معنی می‌کند). نرخ روزمزدی با addDailyRate تغییر می‌کند.
 */
async function updateProject(id, patch) {
  return withTx(["projects", "activity"], "readwrite", async (s) => {
    const old = await s.projects.get(id);
    if (!old) throw new AppError("not-found", "پروژه پیدا نشد.");
    const merged = { ...old, ...patch, type: old.type, customerId: old.customerId };
    const v = validateProject(merged, { isNew: false });
    if (!v.ok) throw failValidation(v.errors);
    const p = await s.projects.put({ ...old, ...v.value });
    await logActivity(s, { entity: "project", entityId: id, action: "update", summary: `پروژه «${p.name}» ویرایش شد` });
    return p;
  });
}

/** افزودن نرخ جدید روزمزدی از یک تاریخ به بعد (نرخ‌های قبلی و روزهای گذشته دست‌نخورده می‌مانند) */
async function addDailyRate(projectId, effectiveFrom, amount) {
  if (!isPosInt(amount)) throw new AppError("validation", "دستمزد روزانه را وارد کنید.", { amount: "دستمزد روزانه را وارد کنید." });
  if (!/^\d{4}-\d{2}-\d{2}$/.test(effectiveFrom ?? "")) throw new AppError("validation", "تاریخ شروع نرخ را انتخاب کنید.", { effectiveFrom: "تاریخ شروع نرخ را انتخاب کنید." });
  try {
    return await withTx(["projects", "dailyRates", "activity"], "readwrite", async (s) => {
      const p = await s.projects.get(projectId);
      if (!p) throw new AppError("not-found", "پروژه پیدا نشد.");
      if (p.type !== "daily") throw new AppError("validation", "نرخ روزانه فقط برای پروژه روزمزدی است.");
      const r = await s.dailyRates.add({ projectId, effectiveFrom, amount });
      await logActivity(s, { entity: "project", entityId: projectId, action: "rate", summary: `نرخ روزانه «${p.name}» از ${effectiveFrom} تغییر کرد` });
      return r;
    });
  } catch (e) {
    if (e.code === "duplicate") throw new AppError("duplicate", "برای این تاریخ قبلاً نرخ ثبت شده است.", { effectiveFrom: "برای این تاریخ قبلاً نرخ ثبت شده است." });
    throw e;
  }
}

const getProject = (id) => withTx("projects", "readonly", (s) => s.projects.get(id));

async function listRates(projectId) {
  const rates = await withTx("dailyRates", "readonly", (s) => s.dailyRates.getAllByIndex("projectId", projectId));
  return rates.sort((a, b) => (a.effectiveFrom < b.effectiveFrom ? -1 : 1));
}

/** فهرست پروژه‌ها با فیلتر؛ هر مورد نام مشتری هم دارد */
async function listProjects({ customerId, status, type, q = "" } = {}) {
  const [projects, customers] = await Promise.all([
    customerId ? withTx("projects", "readonly", (s) => s.projects.getAllByIndex("customerId", customerId)) : getAll("projects"),
    getAll("customers"),
  ]);
  const names = new Map(customers.map((c) => [c.id, c.name]));
  const key = normalizeText(q);
  return projects
    .filter((p) => (!status || p.status === status) && (!type || p.type === type))
    .map((p) => ({ ...p, customerName: names.get(p.customerId) ?? "—" }))
    .filter((p) => !key || normalizeText(p.name).includes(key) || normalizeText(p.customerName).includes(key))
    .sort((a, b) => (b.startDate ?? b.createdAt).localeCompare(a.startDate ?? a.createdAt));
}

/**
 * تغییر وضعیت اجرا (مستقل از وضعیت مالی). در «یک» تراکنش:
 * تکمیل ⇒ تاریخ پایان واقعی الزامی و پیشرفت ۱۰۰؛ بازگشت از تکمیل ⇒ تاریخ پایان پاک می‌شود.
 */
async function changeProjectStatus(id, { status, actualEndDate = null, progress, statusNote = "", stoppedReason = "" }) {
  return withTx(["projects", "activity"], "readwrite", async (s) => {
    const old = await s.projects.get(id);
    if (!old) throw new AppError("not-found", "پروژه پیدا نشد.");
    const merged = {
      ...old, status, statusNote, stoppedReason,
      progress: progress ?? old.progress,
      actualEndDate: status === "completed" ? actualEndDate : (status === "active" || status === "planned" ? null : (actualEndDate ?? old.actualEndDate)),
    };
    const v = validateProject(merged, { isNew: false });
    if (!v.ok) throw failValidation(v.errors);
    const p = await s.projects.put({ ...old, ...v.value });
    await logActivity(s, { entity: "project", entityId: id, action: "status", summary: `وضعیت «${p.name}» ← ${PROJECT_STATUS[status]}` });
    return p;
  });
}

/** حذف فقط برای پروژه بدون هیچ سابقه (روز کاری، پرداخت، هزینه، پیگیری) */
async function deleteProject(id) {
  return withTx(["projects", "dailyRates", "workDays", "payments", "expenses", "followups", "activity"], "readwrite", async (s) => {
    const p = await s.projects.get(id);
    if (!p) return false;
    const used = (await Promise.all(["workDays", "payments", "expenses", "followups"].map((n) => s[n].countByIndex("projectId", id)))).some((n) => n > 0);
    if (used) throw new AppError("has-data", "این پروژه سابقه ثبت‌شده دارد و حذف نمی‌شود؛ به‌جای آن «لغوشده» کنید.");
    for (const r of await s.dailyRates.getAllByIndex("projectId", id)) await s.dailyRates.delete(r.id);
    await s.projects.delete(id);
    await logActivity(s, { entity: "project", entityId: id, action: "delete", summary: `پروژه «${p.name}» حذف شد` });
    return true;
  });
}



return { createProject, updateProject, addDailyRate, getProject, listRates, listProjects, changeProjectStatus, deleteProject, PROJECT_TYPES };
},

/** workdays.js — برنامه و روزهای کاری (بدون UI) */
const { withTx, logActivity } = __r("js/core/db.js");
const { AppError } = __r("js/core/util.js");
const { rateForDate } = __r("js/core/rules.js");
const { todayISO, diffDays } = __r("js/core/jalali.js");
const { WORKDAY_STATUS } = __r("js/core/constants.js");

const isISO = (s) => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);

/**
 * ثبت یا به‌روزرسانی روز کاری یک پروژه (هر پروژه در هر روز فقط یک رکورد).
 * - روز آینده نمی‌تواند «انجام‌شده» باشد (روز آینده درآمد نیست).
 * - هنگام «انجام‌شده» شدن، نرخ معتبر همان تاریخ به‌صورت عکس لحظه‌ای ذخیره می‌شود
 *   و بعداً با تغییر نرخ عوض نمی‌شود. پروژه‌ای: rate = null (هیچ‌وقت درآمد روزانه نمی‌سازد).
 * - ثبت مجدد یک روز که از قبل «انجام‌شده» است، نرخ ذخیره‌شده را حفظ می‌کند.
 * @param {{projectId:number, date:string, status:string, note?:string, today?:string}} input
 */
async function setWorkDay({ projectId, date, status, note = "", today = todayISO() }) {
  if (!isISO(date)) throw new AppError("validation", "تاریخ را انتخاب کنید.", { date: "تاریخ را انتخاب کنید." });
  if (!(status in WORKDAY_STATUS)) throw new AppError("validation", "وضعیت معتبر نیست.", { status: "وضعیت معتبر نیست." });
  if (status === "done" && diffDays(today, date) > 0)
    throw new AppError("validation", "برای روز آینده نمی‌توان «انجام‌شده» ثبت کرد؛ آن را برنامه‌ریزی کنید.", { status: "برای روز آینده نمی‌توان «انجام‌شده» ثبت کرد؛ آن را برنامه‌ریزی کنید." });

  return withTx(["projects", "dailyRates", "workDays", "activity"], "readwrite", async (s) => {
    const p = await s.projects.get(projectId);
    if (!p) throw new AppError("not-found", "پروژه پیدا نشد.", { projectId: "پروژه را انتخاب کنید." });
    if (p.status === "canceled") throw new AppError("validation", "پروژه لغوشده است.", { projectId: "پروژه لغوشده است." });
    const existing = await s.workDays.getOneByIndex("project_date", [projectId, date]);

    let rate = null;
    if (status === "done" && p.type === "daily") {
      if (existing?.status === "done" && Number.isSafeInteger(existing.rate)) rate = existing.rate;
      else {
        rate = rateForDate(await s.dailyRates.getAllByIndex("projectId", projectId), date);
        if (rate === null) throw new AppError("validation", "برای این پروژه نرخ روزانه ثبت نشده است.");
      }
    }
    const rec = { projectId, customerId: p.customerId, date, status, rate, note: String(note ?? "").trim() };
    const saved = existing ? await s.workDays.put({ ...existing, ...rec }) : await s.workDays.add(rec);
    await logActivity(s, {
      entity: "workDay", entityId: saved.id, action: existing ? "update" : "create",
      summary: `«${p.name}» — ${date} — ${WORKDAY_STATUS[status]}`,
    });
    return saved;
  });
}

async function deleteWorkDay(id) {
  return withTx(["workDays", "projects", "activity"], "readwrite", async (s) => {
    const w = await s.workDays.get(id);
    if (!w) return false;
    const p = await s.projects.get(w.projectId);
    await s.workDays.delete(id);
    await logActivity(s, { entity: "workDay", entityId: id, action: "delete", summary: `روز ${w.date} پروژه «${p?.name ?? "؟"}» حذف شد` });
    return true;
  });
}

/** فهرست روزهای کاری؛ بازه [from, to] شامل دو سر، با فیلتر اختیاری پروژه/مشتری */
async function listWorkDays({ from, to, projectId, customerId } = {}) {
  return withTx("workDays", "readonly", async (s) => {
    let rows;
    if (projectId) rows = await s.workDays.getAllByIndex("projectId", projectId);
    else if (customerId) rows = await s.workDays.getAllByIndex("customerId", customerId);
    else if (from && to) rows = await s.workDays.getAllInRange("date", from, to);
    else rows = await s.workDays.getAll();
    return rows
      .filter((w) => (!from || w.date >= from) && (!to || w.date <= to))
      .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.id - b.id));
  });
}

return { setWorkDay, deleteWorkDay, listWorkDays };
},

    const save = h("button", { type: "button", class: "btn btn--primary" }, "ذخیره");

    ctl.closed.then(resolve);
    save.addEventListener("click", async () => {
      save.disabled = true;
      try {
        const raw = toEnglishDigitsLocal(f.progress.get()).trim();
        const progress = raw === "" ? 0 : (/^\d+$/.test(raw) ? Number(raw) : NaN);
        const st = f.status.get();
        if (st !== "completed" && !Number.isInteger(progress)) { showErrors(Object.values(f), { progress: "درصد پیشرفت باید عدد ۰ تا ۱۰۰ باشد." }); return; }

      } finally { save.disabled = false; }
    });
  });
}
const toEnglishDigitsLocal = (v) => String(v ?? "").replace(/[۰-۹]/g, (c) => c.charCodeAt(0) - 0x06f0).replace(/[٠-٩]/g, (c) => c.charCodeAt(0) - 0x0660);

"js/core/payments.js": () => {
/** payments.js — پرداخت‌ها (فقط افزودنی؛ حذف نمی‌شود، فقط باطل می‌شود) */
const { withTx, logActivity } = __r("js/core/db.js");
const { AppError } = __r("js/core/util.js");
const { todayISO, diffDays } = __r("js/core/jalali.js");
const { formatToman } = __r("js/core/money.js");

const isISO = (s) => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
const fail = (field, msg) => new AppError("validation", msg, { [field]: msg });
const PAYMENT_KINDS = { payment: "دریافت بابت کار", expense_refund: "بازپرداخت هزینه مصرفی" };

/** ثبت پرداخت. kind = payment | expense_refund. تاریخ آینده مجاز نیست (پول در آینده دریافت نشده). */
async function addPayment({ projectId, amount, date, note = "", kind = "payment", today = todayISO() }) {
  if (!Number.isSafeInteger(amount) || amount <= 0) throw fail("amount", "مبلغ را وارد کنید (عدد صحیح بیشتر از صفر).");
  if (!isISO(date)) throw fail("date", "تاریخ را انتخاب کنید.");
  if (diffDays(today, date) > 0) throw fail("date", "تاریخ دریافت نمی‌تواند در آینده باشد.");
  if (!(kind in PAYMENT_KINDS)) throw fail("kind", "نوع پرداخت معتبر نیست.");
  return withTx(["projects", "payments", "activity"], "readwrite", async (s) => {
    const p = await s.projects.get(projectId);
    if (!p) throw new AppError("not-found", "پروژه پیدا نشد.");
    const rec = await s.payments.add({ projectId, customerId: p.customerId, amount, date, note: String(note ?? "").trim(), kind, voidedAt: null, voidReason: null });
    await logActivity(s, { entity: "payment", entityId: rec.id, action: "create", summary: `${PAYMENT_KINDS[kind]} ${formatToman(amount)} — «${p.name}»` });
    return rec;
  });
}

/** باطل‌سازی پرداخت اشتباه (در تاریخچه می‌ماند). دلیل الزامی است. */
async function voidPayment(id, reason) {
  const why = String(reason ?? "").trim();
  if (!why) throw fail("reason", "دلیل باطل‌سازی را بنویسید.");
  return withTx(["payments", "projects", "activity"], "readwrite", async (s) => {
    const old = await s.payments.get(id);
    if (!old) throw new AppError("not-found", "پرداخت پیدا نشد.");
    if (old.voidedAt) throw new AppError("validation", "این پرداخت قبلاً باطل شده است.");
    const p = await s.projects.get(old.projectId);
    const rec = await s.payments.put({ ...old, voidedAt: new Date().toISOString(), voidReason: why });
    await logActivity(s, { entity: "payment", entityId: id, action: "void", summary: `پرداخت ${formatToman(old.amount)} «${p?.name ?? "؟"}» باطل شد` });
    return rec;
  });
}

/** فهرست پرداخت‌ها (جدیدترین اول)، شامل باطل‌شده‌ها */
async function listPayments({ projectId, customerId } = {}) {
  const rows = await withTx("payments", "readonly", (s) =>
    projectId ? s.payments.getAllByIndex("projectId", projectId)
      : customerId ? s.payments.getAllByIndex("customerId", customerId)
      : s.payments.getAll());
  return rows.sort((a, b) => (a.date === b.date ? b.id - a.id : a.date < b.date ? 1 : -1));
}

return { PAYMENT_KINDS, addPayment, voidPayment, listPayments };
},
