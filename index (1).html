<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <title>پیمانکار من</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>/* ==========================================================
   tokens.css — تنها منبع رنگ، فاصله، شعاع، سایه و تایپوگرافی
   ========================================================== */
:root {
  color-scheme: dark;

  /* سطوح */
  --bg: #0b1220;
  --bg-elev: #0f1828;
  --card: #151d2c;
  --card-2: #1b2538;
  --card-hover: #1f2b40;
  --border: rgba(255, 255, 255, 0.07);
  --border-strong: rgba(255, 255, 255, 0.14);
  --overlay: rgba(4, 8, 16, 0.66);

  /* متن */
  --text: #e8edf5;
  --text-2: #9aa7bd;
  --text-3: #66748c;
  --text-on-accent: #06222a;

  /* رنگ‌های معنایی */
  --accent: #2dd4bf;
  --accent-2: #38bdf8;
  --accent-soft: rgba(45, 212, 191, 0.14);
  --accent-glow: rgba(45, 212, 191, 0.28);
  --success: #34d399;
  --success-soft: rgba(52, 211, 153, 0.14);
  --warning: #fb923c;
  --warning-soft: rgba(251, 146, 60, 0.14);
  --danger: #f87171;
  --danger-soft: rgba(248, 113, 113, 0.14);
  --info: #60a5fa;
  --info-soft: rgba(96, 165, 250, 0.14);

  /* شیب‌ها */
  --grad-accent: linear-gradient(135deg, #2dd4bf 0%, #38bdf8 100%);
  --grad-card: linear-gradient(160deg, #1a2438 0%, #141c2b 100%);

  /* فاصله */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;
  --sp-10: 40px;

  /* شعاع */
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 28px;
  --r-full: 999px;

  /* سایه */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.32);
  --shadow-lg: 0 18px 48px rgba(0, 0, 0, 0.5);
  --shadow-accent: 0 8px 24px rgba(45, 212, 191, 0.22);

  /* تایپوگرافی */
  --font: "Vazirmatn", "Noto Sans Arabic", "Noto Naskh Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --fs-xs: 0.75rem;
  --fs-sm: 0.8125rem;
  --fs-md: 0.9375rem;
  --fs-lg: 1.0625rem;
  --fs-xl: 1.25rem;
  --fs-2xl: 1.625rem;
  --fs-3xl: 2rem;
  --lh: 1.75;

  /* حرکت */
  --ease: cubic-bezier(0.22, 0.8, 0.28, 1);
  --t-fast: 140ms;
  --t-med: 260ms;

  /* ابعاد ثابت */
  --header-h: 56px;
  --nav-h: 64px;
  --content-max: 640px;
  --touch: 48px;

  /* ناحیه امن (ناچ/نوار ناوبری سیستم) */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

/* فونت اختصاصی (اختیاری): فایل را در fonts/ بگذارید و این بلوک را فعال کنید
@font-face {
  font-family: "Vazirmatn";
  src: url("../fonts/Vazirmatn-Variable.woff2") format("woff2");
  font-weight: 100 900;
  font-display: swap;
}
*/

/* base.css — ریست، تایپوگرافی پایه، دسترس‌پذیری */
*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs-md);
  line-height: var(--lh);
  min-height: 100dvh;
  overflow: hidden;            /* اسکرول فقط داخل main */
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: var(--fs-2xl); line-height: 1.4; font-weight: 800; }
h2 { font-size: var(--fs-xl);  line-height: 1.5; font-weight: 700; }
h3 { font-size: var(--fs-lg);  line-height: 1.5; font-weight: 700; }

a { color: var(--accent); text-decoration: none; }
button { font: inherit; color: inherit; }
input, select, textarea { font: inherit; color: inherit; }

button, a, [role="button"], input, select, textarea { touch-action: manipulation; }

.num, .ltr {
  direction: ltr;
  unicode-bidi: isolate;
  display: inline-block;
}
.num { font-variant-numeric: tabular-nums; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

::selection { background: var(--accent-soft); }

/* اسکرول‌بار ظریف */
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* layout.css — قالب کلی: هدر، محتوا، ناوبری پایین */
#app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(900px 420px at 85% -10%, rgba(45, 212, 191, 0.10), transparent 60%),
    radial-gradient(700px 380px at -10% 0%, rgba(56, 189, 248, 0.07), transparent 55%),
    var(--bg);
}

.app-header {
  flex: none;
  height: calc(var(--header-h) + var(--safe-top));
  padding: var(--safe-top) var(--sp-4) 0;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  background: linear-gradient(to bottom, rgba(11, 18, 32, 0.92), rgba(11, 18, 32, 0.78));
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  z-index: 20;
}
.app-header__title {
  flex: 1;
  font-size: var(--fs-lg);
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.app-header__actions { display: flex; align-items: center; gap: var(--sp-1); }

.offline-pill {
  display: none;
  align-items: center;
  gap: 6px;
  padding: 2px 10px;
  border-radius: var(--r-full);
  background: var(--warning-soft);
  color: var(--warning);
  font-size: var(--fs-xs);
  font-weight: 600;
}
body.is-offline .offline-pill { display: inline-flex; }

.app-main {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}

.page {
  width: 100%;
  max-width: var(--content-max);
  margin-inline: auto;
  padding: var(--sp-4) var(--sp-4) calc(var(--nav-h) + var(--safe-bottom) + var(--sp-8));
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  animation: page-in var(--t-med) var(--ease) both;
}
@keyframes page-in {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}

.bottom-nav {
  flex: none;
  position: relative;
  z-index: 20;
  height: calc(var(--nav-h) + var(--safe-bottom));
  padding: 0 var(--sp-2) var(--safe-bottom);
  display: flex;
  background: rgba(15, 24, 40, 0.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
}
.bottom-nav__item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  color: var(--text-3);
  font-size: 0.6875rem;
  font-weight: 600;
  position: relative;
  transition: color var(--t-fast) var(--ease);
}
.bottom-nav__item svg { transition: transform var(--t-med) var(--ease); }
.bottom-nav__item.is-active { color: var(--accent); }
.bottom-nav__item.is-active svg { transform: translateY(-2px) scale(1.08); }
.bottom-nav__item.is-active::before {
  content: "";
  position: absolute;
  top: 0;
  width: 28px;
  height: 3px;
  border-radius: 0 0 4px 4px;
  background: var(--grad-accent);
  box-shadow: 0 2px 12px var(--accent-glow);
}

@media (min-width: 700px) {
  .bottom-nav { justify-content: center; }
  .bottom-nav__item { max-width: 120px; }
}

/* components.css — کامپوننت‌های قابل استفاده مجدد */

/* ---------- Card ---------- */
.card {
  background: var(--grad-card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-4);
  box-shadow: var(--shadow-sm);
}
.card--flat { background: var(--card); }
.card--tap { cursor: pointer; transition: transform var(--t-fast) var(--ease), background var(--t-fast); }
.card--tap:active { transform: scale(0.985); background: var(--card-hover); }
.card__title { font-size: var(--fs-sm); color: var(--text-2); font-weight: 600; margin-bottom: var(--sp-2); }

.section-title {
  display: flex; align-items: center; justify-content: space-between;
  font-size: var(--fs-md); font-weight: 700; color: var(--text);
  padding-inline: var(--sp-1);
}
.section-title small { color: var(--text-3); font-weight: 500; font-size: var(--fs-xs); }

/* ---------- Button ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  min-height: var(--touch); padding: 0 var(--sp-5);
  border: 1px solid transparent; border-radius: var(--r-md);
  background: var(--card-2); color: var(--text);
  font-weight: 700; font-size: var(--fs-md); cursor: pointer;
  transition: transform var(--t-fast) var(--ease), background var(--t-fast), box-shadow var(--t-fast), opacity var(--t-fast);
  user-select: none; -webkit-user-select: none;
}
.btn:active { transform: scale(0.97); }
.btn[disabled] { opacity: 0.45; pointer-events: none; }
.btn--primary { background: var(--grad-accent); color: var(--text-on-accent); box-shadow: var(--shadow-accent); }
.btn--ghost { background: transparent; border-color: var(--border-strong); }
.btn--danger { background: var(--danger-soft); color: var(--danger); border-color: rgba(248, 113, 113, 0.3); }
.btn--block { width: 100%; }
.btn--sm { min-height: 36px; padding: 0 var(--sp-3); font-size: var(--fs-sm); border-radius: var(--r-sm); }

.icon-btn {
  width: 44px; height: 44px; display: inline-grid; place-items: center;
  border: 0; border-radius: var(--r-full); background: transparent; color: var(--text-2);
  cursor: pointer; transition: background var(--t-fast), color var(--t-fast), transform var(--t-fast);
}
.icon-btn:active { background: var(--card-2); color: var(--text); transform: scale(0.92); }

.fab {
  position: fixed;
  inset-inline-start: var(--sp-4);
  bottom: calc(var(--nav-h) + var(--safe-bottom) + var(--sp-4));
  width: 58px; height: 58px; border-radius: 20px; border: 0;
  display: grid; place-items: center;
  background: var(--grad-accent); color: var(--text-on-accent);
  box-shadow: var(--shadow-accent), var(--shadow-md);
  cursor: pointer; z-index: 15;
  transition: transform var(--t-fast) var(--ease);
}
.fab:active { transform: scale(0.92); }

/* ---------- Field ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field__label { font-size: var(--fs-sm); color: var(--text-2); font-weight: 600; padding-inline: 2px; }
.field__label .req { color: var(--danger); margin-inline-start: 2px; }
.field__control {
  width: 100%; min-height: var(--touch);
  padding: 10px var(--sp-4);
  background: var(--bg-elev);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-md);
  color: var(--text);
  transition: border-color var(--t-fast), box-shadow var(--t-fast), background var(--t-fast);
}
textarea.field__control { min-height: 92px; resize: vertical; }
.field__control::placeholder { color: var(--text-3); }
.field__control:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--card); }
.field--error .field__control { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
.field__hint { font-size: var(--fs-xs); color: var(--text-3); padding-inline: 2px; }
.field__error { font-size: var(--fs-xs); color: var(--danger); padding-inline: 2px; min-height: 0; }
.field__control.is-amount { direction: ltr; text-align: end; font-weight: 700; font-variant-numeric: tabular-nums; }
.field__suffix { position: relative; }
.field__suffix > .field__control { padding-inline-end: 64px; }
.field__suffix > span {
  position: absolute; inset-inline-end: var(--sp-4); top: 50%; transform: translateY(-50%);
  color: var(--text-3); font-size: var(--fs-sm); pointer-events: none;
}

/* ---------- Search ---------- */
.search {
  display: flex; align-items: center; gap: var(--sp-2);
  height: var(--touch); padding: 0 var(--sp-4);
  background: var(--bg-elev); border: 1px solid var(--border-strong); border-radius: var(--r-full);
  color: var(--text-3);
}
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--text); }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

/* ---------- Segmented / Chips ---------- */
.segmented { display: flex; padding: 4px; gap: 4px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--r-md); }
.segmented button {
  flex: 1; min-height: 40px; border: 0; border-radius: var(--r-sm);
  background: transparent; color: var(--text-2); font-weight: 600; cursor: pointer;
  transition: background var(--t-fast), color var(--t-fast);
}
.segmented button.is-active { background: var(--card-2); color: var(--accent); box-shadow: var(--shadow-sm); }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 10px; border-radius: var(--r-full);
  font-size: var(--fs-xs); font-weight: 700; line-height: 1.7;
  background: var(--card-2); color: var(--text-2);
}
.badge--success { background: var(--success-soft); color: var(--success); }
.badge--warning { background: var(--warning-soft); color: var(--warning); }
.badge--danger  { background: var(--danger-soft);  color: var(--danger); }
.badge--info    { background: var(--info-soft);    color: var(--info); }
.badge--accent  { background: var(--accent-soft);  color: var(--accent); }

/* ---------- Stat ---------- */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
.stat { padding: var(--sp-4); border-radius: var(--r-lg); background: var(--grad-card); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; }
.stat__label { font-size: var(--fs-xs); color: var(--text-2); font-weight: 600; }
.stat__value { font-size: var(--fs-xl); font-weight: 800; line-height: 1.5; }
.stat__unit { font-size: var(--fs-xs); color: var(--text-3); }
.stat--accent .stat__value { color: var(--accent); }
.stat--success .stat__value { color: var(--success); }
.stat--danger .stat__value { color: var(--danger); }
.stat--warning .stat__value { color: var(--warning); }

/* ---------- List ---------- */
.list { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
.list-item {
  display: flex; align-items: center; gap: var(--sp-3);
  min-height: 60px; padding: var(--sp-3) var(--sp-4);
  color: inherit; cursor: pointer; background: transparent; border: 0; width: 100%; text-align: start;
  transition: background var(--t-fast);
}
.list-item + .list-item { border-top: 1px solid var(--border); }
.list-item:active { background: var(--card-hover); }
.list-item__icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.list-item__body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.list-item__title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-item__sub { font-size: var(--fs-sm); color: var(--text-2); }
.list-item__end { color: var(--text-3); flex: none; display: flex; align-items: center; }

.kv { display: flex; justify-content: space-between; gap: var(--sp-3); padding: 6px 0; font-size: var(--fs-sm); }
.kv + .kv { border-top: 1px dashed var(--border); }
.kv span:first-child { color: var(--text-2); }
.kv span:last-child { font-weight: 700; text-align: end; }

/* ---------- Progress ---------- */
.progress { height: 8px; border-radius: var(--r-full); background: var(--bg-elev); overflow: hidden; }
.progress > i { display: block; height: 100%; border-radius: inherit; background: var(--grad-accent); transition: width var(--t-med) var(--ease); }

/* ---------- Empty state ---------- */
.empty {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: var(--sp-3); padding: var(--sp-8) var(--sp-5);
  border: 1px dashed var(--border-strong); border-radius: var(--r-xl);
  background: rgba(21, 29, 44, 0.5);
}
.empty__icon { width: 72px; height: 72px; border-radius: 24px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.empty__title { font-size: var(--fs-lg); font-weight: 700; }
.empty__text { color: var(--text-2); font-size: var(--fs-sm); max-width: 28em; }

/* ---------- Banner ---------- */
.banner { display: flex; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md); font-size: var(--fs-sm); align-items: flex-start; }
.banner--info { background: var(--info-soft); color: var(--info); }
.banner--warning { background: var(--warning-soft); color: var(--warning); }
.banner--danger { background: var(--danger-soft); color: var(--danger); }
.banner--success { background: var(--success-soft); color: var(--success); }
.banner svg { flex: none; margin-top: 3px; }
.banner span { color: var(--text); }

/* ---------- Sheet / Modal ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 50; background: var(--overlay);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fade-in var(--t-fast) linear both;
}
.overlay.is-closing { animation: fade-out var(--t-fast) linear both; }
.sheet {
  width: 100%; max-width: var(--content-max); max-height: 88dvh; overflow-y: auto;
  background: var(--card); border: 1px solid var(--border-strong); border-bottom: 0;
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  padding: var(--sp-3) var(--sp-5) calc(var(--sp-6) + var(--safe-bottom));
  box-shadow: var(--shadow-lg);
  animation: sheet-in var(--t-med) var(--ease) both;
}
.overlay.is-closing .sheet { animation: sheet-out var(--t-fast) ease-in both; }
.sheet__grip { width: 44px; height: 5px; border-radius: var(--r-full); background: var(--border-strong); margin: 0 auto var(--sp-4); }
.sheet__title { margin-bottom: var(--sp-2); }
.sheet__text { color: var(--text-2); margin-bottom: var(--sp-5); }
.sheet__actions { display: flex; gap: var(--sp-3); margin-top: var(--sp-5); }
.sheet__actions .btn { flex: 1; }
.sheet__form { display: flex; flex-direction: column; gap: var(--sp-4); margin-top: var(--sp-4); }

@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
@keyframes sheet-in { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes sheet-out { from { transform: none; opacity: 1; } to { transform: translateY(40px); opacity: 0; } }

/* ---------- Toast ---------- */
.toast-host {
  position: fixed; inset-inline: var(--sp-4);
  bottom: calc(var(--nav-h) + var(--safe-bottom) + var(--sp-3));
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-2);
  z-index: 60; pointer-events: none;
}
.toast {
  pointer-events: auto; max-width: min(100%, 480px);
  display: flex; align-items: center; gap: var(--sp-3);
  padding: 12px var(--sp-4); border-radius: var(--r-md);
  background: var(--card-2); border: 1px solid var(--border-strong);
  box-shadow: var(--shadow-lg); font-size: var(--fs-sm); font-weight: 600;
  animation: toast-in var(--t-med) var(--ease) both;
}
.toast.is-leaving { animation: toast-out var(--t-fast) ease-in both; }
.toast--success svg { color: var(--success); }
.toast--error svg { color: var(--danger); }
.toast--warning svg { color: var(--warning); }
.toast--info svg { color: var(--info); }
.toast button { margin-inline-start: var(--sp-2); background: none; border: 0; color: var(--accent); font-weight: 800; cursor: pointer; padding: 4px 8px; }
@keyframes toast-in { from { opacity: 0; transform: translateY(14px) scale(0.96); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }

/* ---------- Skeleton ---------- */

/**
 * dom.js — ساخت امن عناصر DOM (بدون innerHTML برای داده‌ی کاربر)
 * h("div", { class: "card", onClick: fn }, "متن", childNode, [..])
 */
function h(tag, props, ...children) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class" || k === "className") el.className = v;
      else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
      else if (k === "dataset") Object.assign(el.dataset, v);
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (["value", "checked", "disabled", "selected", "readOnly", "required"].includes(k)) el[k] = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
  }
  append(el, children);
  return el;
}

function append(el, children) {
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

/** عنصر عددی با جهت LTR داخل متن فارسی */
const num = (text, cls = "") => h("span", { class: "num " + cls }, text);

return { h, append, num };

const ICONS = { success: "check-circle", error: "alert-circle", warning: "alert", info: "info" };

function ensureHost() {
  if (host && host.isConnected) return host;
  host = h("div", { class: "toast-host", role: "status", "aria-live": "polite" });

/**
 * @param {string} message
 * @param {{type?: "success"|"error"|"warning"|"info", duration?: number, action?: {label: string, onClick: Function}}} opts
 */
function toast(message, { type = "info", duration, action } = {}) {
  const ms = duration ?? (type === "error" ? 5000 : 2800);
  const el = h("div", { class: `toast toast--${type}` }, icon(ICONS[type] ?? "info", 20), h("span", null, message));
  let timer;

    clearTimeout(timer);

    setTimeout(() => el.remove(), 160);
  };
  if (action) {
    el.append(h("button", { type: "button", onClick: () => { action.onClick(); close(); } }, action.label));
  }
  ensureHost().append(el);
  timer = setTimeout(close, ms);
  return close;
}

    const m = r.rx.exec(path);
    if (m) {
      const params = {};
      r.keys.forEach((k, i) => (params[k] = decodeURIComponent(m[i + 1])));
      match = { r, params };
      break;
    }
  }
  if (!match) { navigate("/", { replace: true }); return; }

  const ctx = { path, query, params: match.params, meta: { ...match.r.meta }, setTitle(t) { ctx.meta.title = t; onChange(ctx); } };
  onChange(ctx);
  try {
    const node = await match.r.handler(ctx);
    if (my !== token) return;                 // کاربر در این فاصله به صفحه دیگری رفته
    outlet.replaceChildren(node);
    outlet.scrollTop = 0;
    onChange(ctx);
  } catch (err) {
    if (my !== token) return;
    console.error("[router]", err);
    const box = document.createElement("div");
    box.className = "page";
    box.innerHTML = '<div class="banner banner--danger"><span>خطا در نمایش صفحه. دوباره تلاش کنید.</span></div>';
    outlet.replaceChildren(box);
  }
}

function navigate(path, { replace = false } = {}) {
  const target = "#" + path;
  if (location.hash === target) { render(); return; }
  internalNavs++;
  if (replace) location.replace(target); else location.hash = target;
}

/** بازگشت به صفحه قبلی؛ اگر تاریخچه داخلی نبود به مسیر جایگزین می‌رود */
function back(fallback = "/") {
  if (internalNavs > 0) { internalNavs--; history.back(); } else navigate(fallback, { replace: true });
}

function refresh() { return render(); }

function startRouter(el, changeHandler) {
  outlet = el;
  onChange = changeHandler || onChange;
  window.addEventListener("hashchange", render);
  return render();
}

return { route, navigate, back, refresh, startRouter };
},
"js/core/db.js": () => {
/**
 * db.js — لایه دسترسی به IndexedDB
 *
 * اصول:
 *  - هر عملیات ثبت/ویرایش در یک تراکنش با durability = "strict" انجام می‌شود
 *    (یعنی قبل از اعلام موفقیت، روی حافظه دائمی نوشته شده است) → ذخیره خودکار، بدون دکمه.
 *  - عملیات چندمرحله‌ای حتماً در «یک» withTx اجرا شوند تا اتمیک باشند.
 *  - داخل withTx فقط روی نتیجه‌ی متدهای stores صبر کنید (await روی fetch/setTimeout تراکنش را می‌بندد).
 */
const { DB_NAME, DB_VERSION, upgrade } = __r("js/core/schema.js");
const { AppError, nowISO } = __r("js/core/util.js");
const { emit } = __r("js/core/events.js");

let dbPromise = null;

function openDB(name = DB_NAME) {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    if (!("indexedDB" in globalThis)) {
      reject(new AppError("no-idb", "مرورگر شما از ذخیره‌سازی محلی (IndexedDB) پشتیبانی نمی‌کند."));
      return;
    }
    const req = indexedDB.open(name, DB_VERSION);
    req.onupgradeneeded = (e) => {
      try {
        upgrade(req.result, e.oldVersion, e.newVersion, req.transaction);
      } catch (err) {
        req.transaction.abort();
        reject(new AppError("migration", "ارتقای ساختار دیتابیس ناموفق بود.", err));
      }
    };
    req.onsuccess = () => {
      const db = req.result;
      db.onversionchange = () => { db.close(); dbPromise = null; };   // تب دیگر در حال ارتقا
      db.onclose = () => { dbPromise = null; };
      resolve(db);
    };
    req.onerror = () => { dbPromise = null; reject(new AppError("open", "باز کردن دیتابیس ناموفق بود.", req.error)); };
    req.onblocked = () => reject(new AppError("blocked", "برنامه در تب یا پنجره دیگری باز است؛ آن را ببندید و دوباره تلاش کنید."));
  });
  dbPromise.catch(() => { dbPromise = null; });
  return dbPromise;
}

async function closeDB() {
  if (!dbPromise) return;
  const db = await dbPromise.catch(() => null);
  dbPromise = null;
  db?.close();
}

async function deleteDatabase(name = DB_NAME) {
  await closeDB();
  return new Promise((resolve, reject) => {
    const r = indexedDB.deleteDatabase(name);
    r.onsuccess = () => resolve();
    r.onerror = () => reject(r.error);
    r.onblocked = () => reject(new AppError("blocked", "حذف دیتابیس مسدود شد."));
  });
}

function toAppError(err) {
  if (err instanceof AppError) return err;
  if (err?.name === "ConstraintError") return new AppError("duplicate", "این مورد قبلاً ثبت شده است.", err);
  if (err?.name === "QuotaExceededError") return new AppError("quota", "فضای ذخیره‌سازی دستگاه پر است.", err);
  return err instanceof Error ? err : new AppError("db", String(err));
}

const asPromise = (req) =>
  new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(toAppError(req.error));
  });

/** پوشش ساده روی objectStore با Promise و زمان‌های createdAt/updatedAt */
function wrapStore(store) {
  return {
    raw: store,
    async add(rec) {
      const now = nowISO();
      const record = { ...rec, createdAt: rec.createdAt ?? now, updatedAt: now };
      const id = await asPromise(store.add(record));
      return { ...record, ...(store.autoIncrement ? { [store.keyPath]: id } : {}) };
    },
    async put(rec) {
      const record = { ...rec, updatedAt: nowISO() };
      await asPromise(store.put(record));
      return record;
    },
    get: (key) => asPromise(store.get(key)),
    getAll: () => asPromise(store.getAll()),
    count: () => asPromise(store.count()),
    delete: (key) => asPromise(store.delete(key)),
    clear: () => asPromise(store.clear()),
    getAllByIndex: (index, key) => asPromise(store.index(index).getAll(key)),
    getOneByIndex: (index, key) => asPromise(store.index(index).get(key)),
    countByIndex: (index, key) => asPromise(store.index(index).count(key)),
    /** بازه روی ایندکس: IDBKeyRange.bound(lo, hi) */
    getAllInRange: (index, lo, hi) => asPromise(store.index(index).getAll(IDBKeyRange.bound(lo, hi))),
  };
}

/**
 * اجرای کار در یک تراکنش.
 * @param {string|string[]} storeNames
 * @param {"readonly"|"readwrite"} mode
 * @param {(stores: Record<string, ReturnType<typeof wrapStore>>) => Promise<any>} work
 */
async function withTx(storeNames, mode, work) {
  const names = Array.isArray(storeNames) ? storeNames : [storeNames];
  const db = await openDB();
  return new Promise((resolve, reject) => {
    let tx;
    try {
      tx = mode === "readwrite" ? db.transaction(names, mode, { durability: "strict" }) : db.transaction(names, mode);
    } catch (err) { reject(toAppError(err)); return; }

    let result;
    let failure = null;
    tx.oncomplete = () => {
      if (mode === "readwrite") emit("db:changed", { stores: names });
      resolve(result);
    };
    tx.onabort = () => reject(failure ?? toAppError(tx.error) ?? new AppError("abort", "عملیات لغو شد."));
    tx.onerror = () => {}; // خطا در onabort رسیدگی می‌شود

    const stores = Object.fromEntries(names.map((n) => [n, wrapStore(tx.objectStore(n))]));
    Promise.resolve()
      .then(() => work(stores))
      .then((r) => { result = r; })
      .catch((err) => {
        failure = toAppError(err);
        try { tx.abort(); } catch { /* تراکنش قبلاً تمام شده */ }
      });
  });
}

/* ---------- میان‌برهای رایج ---------- */
const getAll = (store) => withTx(store, "readonly", (s) => s[store].getAll());
const getById = (store, id) => withTx(store, "readonly", (s) => s[store].get(id));
const countOf = (store) => withTx(store, "readonly", (s) => s[store].count());

/** ثبت یک رخداد در سوابق فعالیت (داخل همان تراکنش عملیات اصلی صدا بزنید) */
function logActivity(stores, { entity, entityId, action, summary }) {
  return stores.activity.add({ at: nowISO(), entity, entityId, action, summary });
}

async function getMeta(key, fallback = null) {
  const row = await withTx("meta", "readonly", (s) => s.meta.get(key));
  return row ? row.value : fallback;
}

function setMeta(key, value) {
  return withTx("meta", "readwrite", (s) => s.meta.put({ key, value }));
}

return { openDB, closeDB, deleteDatabase, withTx, getAll, getById, countOf, logActivity, getMeta, setMeta };
},
"js/core/schema.js": () => {
/**
 * schema.js — ساختار IndexedDB و مهاجرت نسخه‌ها
 *
 * قانون: هرگز نسخه‌ی قدیمی در `migrations` را تغییر ندهید.
 * برای تغییر ساختار: DB_VERSION را یکی زیاد کنید و تابع مهاجرت جدید اضافه کنید.
 * (توضیح کامل مدل داده: ARCHITECTURE.md)
 *
 * نکته: Boolean در IndexedDB قابل ایندکس نیست؛ فیلدهای flag با 0/1 ذخیره می‌شوند.
 */
const DB_NAME = "pcm-db";
const DB_VERSION = 2;

/** تعریف فروشگاه‌ها (هم برای ساخت دیتابیس، هم مستندات، هم تست) */
const STORE_DEFS = {
  meta:      { keyPath: "key", indexes: [] },
  customers: { keyPath: "id", autoIncrement: true, indexes: [
    { name: "nameKey",   keyPath: "nameKey",   unique: true },   // مشتری تکراری ممنوع
    { name: "phone",      keyPath: "phone" },
    { name: "createdAt",  keyPath: "createdAt" },
  ]},
  projects: { keyPath: "id", autoIncrement: true, indexes: [
    { name: "customerId",    keyPath: "customerId" },
    { name: "status",        keyPath: "status" },
    { name: "type",          keyPath: "type" },
    { name: "startDate",     keyPath: "startDate" },
    { name: "actualEndDate", keyPath: "actualEndDate" },
  ]},
  dailyRates: { keyPath: "id", autoIncrement: true, indexes: [
    { name: "projectId",          keyPath: "projectId" },
    { name: "project_effective",  keyPath: ["projectId", "effectiveFrom"], unique: true },
  ]},
  workDays: { keyPath: "id", autoIncrement: true, indexes: [
    { name: "projectId",     keyPath: "projectId" },
    { name: "customerId",    keyPath: "customerId" },
    { name: "date",          keyPath: "date" },
    { name: "status",        keyPath: "status" },
    { name: "project_date",  keyPath: ["projectId", "date"], unique: true }, // هر پروژه در هر روز یک رکورد
  ]},
  payments: { keyPath: "id", autoIncrement: true, indexes: [
    { name: "projectId",  keyPath: "projectId" },
    { name: "customerId", keyPath: "customerId" },
    { name: "date",       keyPath: "date" },
    { name: "kind",       keyPath: "kind" },
  ]},
  expenses: { keyPath: "id", autoIncrement: true, indexes: [
    { name: "projectId", keyPath: "projectId" },
    { name: "date",      keyPath: "date" },
  ]},
  followups: { keyPath: "id", autoIncrement: true, indexes: [
    { name: "customerId",        keyPath: "customerId" },
    { name: "projectId",         keyPath: "projectId" },
    { name: "nextFollowUpDate",  keyPath: "nextFollowUpDate" },
    { name: "done",              keyPath: "done" },
  ]},
  activity: { keyPath: "id", autoIncrement: true, indexes: [
    { name: "at",     keyPath: "at" },
    { name: "entity", keyPath: "entity" },
  ]},
  // نسخه ۲: نسخه‌های پشتیبان داخلی (اسنپ‌شات خودکار)
  backups: { keyPath: "id", autoIncrement: true, indexes: [
    { name: "createdAt", keyPath: "createdAt" },
    { name: "kind",      keyPath: "kind" },
  ]},
};

/** فروشگاه‌هایی که داده‌ی کاربر هستند و در فایل پشتیبان قرار می‌گیرند (meta و backups نه) */
const DATA_STORES = Object.keys(STORE_DEFS).filter((n) => n !== "meta" && n !== "backups");

function createStore(db, name, def) {
  const store = db.createObjectStore(name, { keyPath: def.keyPath, autoIncrement: !!def.autoIncrement });
  for (const ix of def.indexes) store.createIndex(ix.name, ix.keyPath, { unique: !!ix.unique });
  return store;
}

/** مهاجرت‌ها؛ کلید = نسخه‌ای که ساخته می‌شود */
const migrations = {
  1(db /*, tx */) {
    // ساختار نسخه ۱ = همه به‌جز backups (تغییر نده!)
    for (const [name, def] of Object.entries(STORE_DEFS)) if (name !== "backups") createStore(db, name, def);
  },
  2(db /*, tx */) {
    createStore(db, "backups", STORE_DEFS.backups);
  },
  // 3(db, tx) { ... }  ← نمونه برای آینده
};

function upgrade(db, oldVersion, newVersion, tx) {
  for (let v = oldVersion + 1; v <= newVersion; v++) {
    const step = migrations[v];
    if (!step) throw new Error(`مهاجرت دیتابیس برای نسخه ${v} تعریف نشده است`);
    step(db, tx);
  }
}

return { DB_NAME, DB_VERSION, STORE_DEFS, DATA_STORES, migrations, upgrade };
},
"js/core/util.js": () => {
/** util.js — ابزارهای عمومی بدون وابستگی */
const { toEnglishDigits } = __r("js/core/money.js");

/**
 * نرمال‌سازی متن برای مقایسه (کلید یکتا):
 * ي→ی  ك→ک  حذف نیم‌فاصله/اعراب/کشیده  یکی‌کردن فاصله‌ها  ارقام انگلیسی  حروف کوچک
 */
function normalizeText(text) {
  return toEnglishDigits(String(text ?? ""))
    .replace(/[يى]/g, "ی")
    .replace(/ك/g, "ک")
    .replace(/[‌‍‎‏ـً-ٰٟ]/g, "")
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();
}

/** شماره تلفن → فقط ارقام انگلیسی (برای لینک tel:) */
function normalizePhone(text) {
  return toEnglishDigits(String(text ?? "")).replace(/[^\d+]/g, "");
}

function nowISO() { return new Date().toISOString(); }

function debounce(fn, ms = 200) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

/** خطای برنامه با کد قابل‌تشخیص برای نمایش پیام فارسی */
class AppError extends Error {
  constructor(code, message, cause) {
    super(message);
    this.name = "AppError";
    this.code = code;
    if (cause) this.cause = cause;
  }
}

return { normalizeText, normalizePhone, nowISO, debounce, AppError };
},
"js/core/money.js": () => {
/**
 * money.js — مبالغ و ارقام
 * قرارداد: همه مبالغ «عدد صحیح تومان» هستند (بدون اعشار).
 */

const FA = "۰۱۲۳۴۵۶۷۸۹";

function toPersianDigits(value) {
  return String(value).replace(/\d/g, (d) => FA[d]);
}

function toEnglishDigits(value) {
  return String(value)
    .replace(/[۰-۹]/g, (c) => String(c.charCodeAt(0) - 0x06f0))
    .replace(/[٠-٩]/g, (c) => String(c.charCodeAt(0) - 0x0660));
}

/** جداکننده سه‌رقمی با ارقام انگلیسی: 1234567 → "1,234,567" */
function groupDigits(n) {
  const neg = n < 0;
  const s = String(Math.abs(Math.trunc(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return neg ? "-" + s : s;
}

/** نمایش مبلغ با رقم فارسی: ۱٬۲۰۰٬۰۰۰ */
function formatAmount(n) {
  if (n === null || n === undefined || n === "" || Number.isNaN(Number(n))) return "";
  return toPersianDigits(groupDigits(Number(n))).replace(/,/g, "٬");
}

function formatToman(n) {
  const f = formatAmount(n);
  return f === "" ? "" : f + " تومان";
}

/** نمایش خلاصه: ۱۰۰٬۰۰۰٬۰۰۰ → «۱۰۰ میلیون تومان» (برای کارت‌ها) */
function formatTomanShort(n) {
  const v = Number(n);
  if (!Number.isFinite(v)) return "";
  const abs = Math.abs(v);
  const sign = v < 0 ? "-" : "";
  const trim = (x) => toPersianDigits(String(Math.round(x * 100) / 100).replace(".", "٫"));
  if (abs >= 1e9) return `${sign}${trim(abs / 1e9)} میلیارد تومان`;
  if (abs >= 1e6) return `${sign}${trim(abs / 1e6)} میلیون تومان`;
  if (abs >= 1e3) return `${sign}${trim(abs / 1e3)} هزار تومان`;
  return `${sign}${toPersianDigits(abs)} تومان`;
}

/**
 * متن تایپ‌شده کاربر → عدد صحیح یا null.
 * ارقام فارسی/عربی/انگلیسی، جداکننده‌های , ٬ ، و فاصله را می‌پذیرد.
 * اعشار، منفی یا حروف نامعتبرند (null).
 */
function parseAmount(text) {
  if (text === null || text === undefined) return null;
  const s = toEnglishDigits(text).replace(/[,٬،\s‌‏‎]/g, "");
  if (!/^\d+$/.test(s)) return null;
  const n = Number(s);
  return Number.isSafeInteger(n) ? n : null;
}

/** اعتبارسنجی مبلغ برای فرم‌ها */
function validateAmount(text, { allowZero = false, max = 1e12 } = {}) {
  if (String(text ?? "").trim() === "") return { ok: false, error: "مبلغ را وارد کنید." };
  const n = parseAmount(text);
  if (n === null) return { ok: false, error: "مبلغ باید فقط عدد صحیح باشد." };
  if (!allowZero && n === 0) return { ok: false, error: "مبلغ باید بیشتر از صفر باشد." };
  if (n > max) return { ok: false, error: "مبلغ بیش از حد بزرگ است." };
  return { ok: true, value: n };
}

/** برای فیلد ورودی: حین تایپ جداکننده سه‌رقمی می‌گذارد (رقم انگلیسی، نمایش LTR) */
function formatAmountInput(text) {
  const digits = toEnglishDigits(text).replace(/\D/g, "");
  if (digits === "") return "";
  return groupDigits(Number(digits));
}

return { toPersianDigits, toEnglishDigits, groupDigits, formatAmount, formatToman, formatTomanShort, parseAmount, validateAmount, formatAmountInput };
},
"js/core/events.js": () => {
/** events.js — رویدادهای ساده بین ماژول‌ها (مثلاً «داده تغییر کرد») */
const listeners = new Map();

function on(event, fn) {
  if (!listeners.has(event)) listeners.set(event, new Set());
  listeners.get(event).add(fn);
  return () => listeners.get(event)?.delete(fn);
}

function emit(event, detail) {
  for (const fn of [...(listeners.get(event) ?? [])]) {
    try { fn(detail); } catch (e) { console.error("[events]", event, e); }
  }
}

return { on, emit };
},
"js/core/storage.js": () => {
/** storage.js — درخواست ذخیره‌سازی پایدار و گزارش وضعیت فضا */

async function requestPersistence() {
  try {
    if (!navigator.storage?.persist) return { supported: false, persisted: false };
    if (await navigator.storage.persisted()) return { supported: true, persisted: true };
    const granted = await navigator.storage.persist();
    return { supported: true, persisted: !!granted };
  } catch {
    return { supported: false, persisted: false };
  }
}

async function storageStatus() {
  const out = { supported: !!navigator.storage?.persist, persisted: false, usage: null, quota: null };
  try {
    if (navigator.storage?.persisted) out.persisted = await navigator.storage.persisted();
    if (navigator.storage?.estimate) {
      const e = await navigator.storage.estimate();
      out.usage = e.usage ?? null;
      out.quota = e.quota ?? null;
    }
  } catch { /* ignore */ }
  return out;
}

function formatBytes(n) {
  if (n == null) return "—";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}

return { requestPersistence, storageStatus, formatBytes };
},

"js/core/finance.js": () => {
/**
 * finance.js — منطق مالی خالص (بدون DB و DOM؛ قابل تست در Node).
 * قوانین: ARCHITECTURE.md بخش ۴.
 * ds = { customers, projects, workDays, payments, expenses, followups }
 */
const { dailyIncome } = __r("js/core/rules.js");
const { diffDays } = __r("js/core/jalali.js");

const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);

/** پرداخت‌های معتبر (باطل‌نشده) */
const validPayments = (payments) => payments.filter((p) => !p.voidedAt);

/**
 * وضعیت مالی یک پروژه.
 * - روزمزدی: قابل دریافت = درآمد روزهای انجام‌شده
 * - پروژه‌ای: قابل دریافت = مبلغ قرارداد (پروژه لغوشده: ۰)؛ «درآمد کسب‌شده» فقط پس از تکمیل
 * - بازپرداخت هزینه (expense_refund) نه درآمد است نه از مانده کم می‌کند
 * @param {{asOf?: string|null}} opts  اگر داده شود فقط رویدادهای تا آن تاریخ حساب می‌شوند
 */
function projectFinance(project, workDays, payments, { asOf = null } = {}) {
  const days = workDays.filter((w) => w.projectId === project.id && w.status === "done" && (!asOf || w.date <= asOf));
  const pays = validPayments(payments).filter((p) => p.projectId === project.id && (!asOf || p.date <= asOf));
  const paid = sum(pays.filter((p) => p.kind === "payment"), (p) => p.amount);
  const refunds = sum(pays.filter((p) => p.kind === "expense_refund"), (p) => p.amount);

  let earned, payable;
  if (project.type === "daily") {
    earned = dailyIncome(days);
    payable = earned;
  } else {
    const completedByThen = project.status === "completed" && project.actualEndDate && (!asOf || project.actualEndDate <= asOf);
    earned = completedByThen ? project.contractAmount ?? 0 : 0;
    const started = !asOf || !project.startDate || project.startDate <= asOf;
    payable = project.status === "canceled" || !started ? 0 : project.contractAmount ?? 0;
  }
  const remaining = Math.max(0, payable - paid);
  const credit = Math.max(0, paid - payable);
  let status;
  if (payable === 0 && paid === 0) status = "none";
  else if (paid === 0) status = "unpaid";
  else if (remaining > 0) status = "partial";
  else status = "paid";
  return { earned, payable, paid, refunds, remaining, credit, status, doneDays: days.length };
}

const SETTLEMENT_LABEL = { none: "—", unpaid: "تسویه‌نشده", partial: "تسویه جزئی", paid: "تسویه کامل" };

/** روزهای گذشته از یک تاریخ تا امروز (≥۰) */
const daysSince = (iso, today) => (iso ? Math.max(0, diffDays(iso, today)) : null);

/** آخرین تاریخ تماس برای مشتری (و در صورت داشتن، پروژه) */
function lastContactDate(followups, customerId, projectId = null) {
  let last = null;
  for (const f of followups) {
    if (f.customerId !== customerId) continue;
    if (projectId && f.projectId && f.projectId !== projectId) continue;
    if (!last || f.contactDate > last) last = f.contactDate;
  }
  return last;
}

/**
 * فهرست مطالبات به تفکیک مشتری (فقط مشتریانی که مانده > ۰ دارند).
 * delay = بیشترین روز گذشته از پایان پروژه‌های «تکمیل‌شده» تسویه‌نشده
 */
function receivablesByCustomer(ds, today) {
  const byCustomer = new Map();
  for (const p of ds.projects) {
    const fin = projectFinance(p, ds.workDays, ds.payments);
    if (fin.remaining <= 0) continue;
    if (!byCustomer.has(p.customerId)) byCustomer.set(p.customerId, []);
    byCustomer.get(p.customerId).push({ project: p, fin });
  }
  const rows = [];
  for (const [customerId, items] of byCustomer) {
    const customer = ds.customers.find((c) => c.id === customerId);
    if (!customer) continue;
    const completed = items.filter((i) => i.project.status === "completed" && i.project.actualEndDate);
    const delays = completed.map((i) => daysSince(i.project.actualEndDate, today));
    const ends = completed.map((i) => i.project.actualEndDate).sort();
    rows.push({
      customer, items,
      remaining: sum(items, (i) => i.fin.remaining),
      unsettledCount: items.length,
      completedUnsettled: completed.length,
      delay: delays.length ? Math.max(...delays) : 0,
      firstEndDate: ends[0] ?? null,
      lastEndDate: ends[ends.length - 1] ?? null,
      lastFollowUp: lastContactDate(ds.followups, customerId),
    });
  }
  return rows;
}

const totalReceivable = (ds, today) => sum(receivablesByCustomer(ds, today), (r) => r.remaining);

/** خلاصه مالی یک مشتری */
function customerFinance(ds, customerId) {
  const projects = ds.projects.filter((p) => p.customerId === customerId);
  const rows = projects.map((p) => ({ project: p, fin: projectFinance(p, ds.workDays, ds.payments) }));
  return {
    rows,
    earned: sum(rows, (r) => r.fin.earned),
    payable: sum(rows, (r) => r.fin.payable),
    paid: sum(rows, (r) => r.fin.paid),
    refunds: sum(rows, (r) => r.fin.refunds),
    remaining: sum(rows, (r) => r.fin.remaining),
    workingDays: new Set(ds.workDays.filter((w) => w.customerId === customerId && w.status === "done").map((w) => w.date)).size,
  };
}

/** پروژه‌های تکمیل‌شده که هنوز تسویه کامل نشده‌اند */
function completedUnsettled(ds) {
  return ds.projects
    .filter((p) => p.status === "completed")
    .map((p) => ({ project: p, fin: projectFinance(p, ds.workDays, ds.payments) }))
    .filter((r) => r.fin.remaining > 0);
}

/**
 * یادآورها (فقط داخل برنامه؛ هنگام باز بودن برنامه):
 *  - settle: پروژه تکمیل‌شده تسویه‌نشده، ≥۱ روز از پایان گذشته و هیچ تماسی ثبت نشده، یا آخرین تماس ≥۷ روز پیش و پیگیری بعدی تعیین نشده
 *  - followup: پیگیری با تاریخ بعدی رسیده/گذشته و انجام‌نشده
 */
function reminders(ds, today, { settleAfterDays = 1, repeatDays = 7 } = {}) {
  const out = [];
  for (const { project, fin } of completedUnsettled(ds)) {
    const last = lastContactDate(ds.followups, project.customerId, project.id);
    const pending = ds.followups.some((f) => f.customerId === project.customerId && !f.done && f.nextFollowUpDate && f.nextFollowUpDate > today);
    const sinceEnd = daysSince(project.actualEndDate, today);
    const due = last ? !pending && daysSince(last, today) >= repeatDays : sinceEnd >= settleAfterDays;
    if (due) out.push({ type: "settle", project, fin, customerId: project.customerId, sinceEnd, lastContact: last });
  }
  for (const f of ds.followups) {
    if (!f.done && f.nextFollowUpDate && f.nextFollowUpDate <= today) {
      out.push({ type: "followup", followup: f, customerId: f.customerId, overdueDays: diffDays(f.nextFollowUpDate, today) });
    }
  }
  return out;
}

/** پیگیری‌های عقب‌افتاده (تاریخ بعدی گذشته و انجام‌نشده) */
const overdueFollowups = (ds, today) =>
  ds.followups.filter((f) => !f.done && f.nextFollowUpDate && f.nextFollowUpDate < today);

return { validPayments, projectFinance, SETTLEMENT_LABEL, daysSince, lastContactDate, receivablesByCustomer, totalReceivable, customerFinance, completedUnsettled, reminders, overdueFollowups };
},
"js/core/rules.js": () => {
/**
 * rules.js — قوانین خالص (بدون DB و DOM) برای اعتبارسنجی و نرخ روزمزدی.
 * قابل تست در Node.
 */
const { normalizeText, normalizePhone } = __r("js/core/util.js");
const { PROJECT_TYPES, PROJECT_STATUS } = __r("js/core/constants.js");
const { diffDays } = __r("js/core/jalali.js");

const isISO = (s) => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
const isPosInt = (n) => Number.isSafeInteger(n) && n > 0;

/** @returns {{ok: boolean, errors: Record<string,string>, value: object}} */
function validateCustomer(input) {
  const errors = {};
  const name = String(input.name ?? "").replace(/\s+/g, " ").trim();
  if (!name) errors.name = "نام مشتری را وارد کنید.";
  else if (name.length > 80) errors.name = "نام خیلی طولانی است.";
  const phoneRaw = String(input.phone ?? "").trim();
  const phone = normalizePhone(phoneRaw);
  if (phoneRaw && !/^\+?\d{5,15}$/.test(phone)) errors.phone = "شماره تماس معتبر نیست.";
  if (input.firstCollabDate && !isISO(input.firstCollabDate)) errors.firstCollabDate = "تاریخ معتبر نیست.";
  return {
    ok: Object.keys(errors).length === 0,
    errors,
    value: {
      name, nameKey: normalizeText(name), phone,
      notes: String(input.notes ?? "").trim(),
      firstCollabDate: input.firstCollabDate || null,
    },
  };
}

/**
 * اعتبارسنجی پروژه.
 * - daily: نرخ روزانه اولیه الزامی (فقط هنگام ساخت)
 * - fixed: مبلغ قرارداد الزامی
 * - completed: تاریخ پایان واقعی الزامی
 */
function validateProject(input, { isNew = true } = {}) {
  const errors = {};
  const name = String(input.name ?? "").replace(/\s+/g, " ").trim();
  if (!name) errors.name = "نام پروژه را وارد کنید.";
  if (!isPosInt(input.customerId)) errors.customerId = "مشتری را انتخاب کنید.";
  if (!(input.type in PROJECT_TYPES)) errors.type = "نوع همکاری را انتخاب کنید.";
  if (!(input.status in PROJECT_STATUS)) errors.status = "وضعیت معتبر نیست.";
  for (const k of ["startDate", "expectedEndDate", "actualEndDate"]) {
    if (input[k] && !isISO(input[k])) errors[k] = "تاریخ معتبر نیست.";
  }
  if (input.startDate && input.expectedEndDate && isISO(input.startDate) && isISO(input.expectedEndDate)
      && diffDays(input.startDate, input.expectedEndDate) < 0) {
    errors.expectedEndDate = "تاریخ پایان نباید قبل از شروع باشد.";
  }
  if (input.startDate && input.actualEndDate && isISO(input.startDate) && isISO(input.actualEndDate)
      && diffDays(input.startDate, input.actualEndDate) < 0) {
    errors.actualEndDate = "تاریخ پایان نباید قبل از شروع باشد.";
  }
  if (input.type === "fixed" && !isPosInt(input.contractAmount)) errors.contractAmount = "مبلغ قرارداد را وارد کنید.";
  if (input.type === "daily" && isNew && !isPosInt(input.dailyRate)) errors.dailyRate = "دستمزد روزانه را وارد کنید.";
  if (input.status === "completed" && !input.actualEndDate) errors.actualEndDate = "برای پروژه تکمیل‌شده، تاریخ پایان لازم است.";
  const progress = input.progress ?? 0;
  if (!Number.isInteger(progress) || progress < 0 || progress > 100) errors.progress = "درصد پیشرفت باید ۰ تا ۱۰۰ باشد.";
  if (input.status === "completed" && !errors.progress) { /* پیشرفت کامل نمایش داده می‌شود */ }

  const value = {
    customerId: input.customerId, name, type: input.type, status: input.status,
    contractAmount: input.type === "fixed" ? input.contractAmount : null,
    startDate: input.startDate || null,
    expectedEndDate: input.expectedEndDate || null,
    actualEndDate: input.status === "completed" ? input.actualEndDate : (input.actualEndDate || null),
    progress: input.status === "completed" ? 100 : progress,
    statusNote: String(input.statusNote ?? "").trim(),
    stoppedReason: String(input.stoppedReason ?? "").trim(),
    notes: String(input.notes ?? "").trim(),
  };
  return { ok: Object.keys(errors).length === 0, errors, value };
}

/**
 * نرخ معتبر روزمزدی برای یک تاریخ: آخرین نرخی که effectiveFrom ≤ تاریخ.
 * اگر تاریخ قبل از اولین نرخ بود (مثلاً روز کاری قبل از تاریخ شروع)، اولین نرخ برگردانده می‌شود
 * تا درآمد هیچ‌وقت بی‌صدا صفر نشود.
 * @param {{effectiveFrom: string, amount: number}[]} rates
 * @returns {number|null} null فقط وقتی هیچ نرخی ثبت نشده باشد
 */
function rateForDate(rates, dateISO) {
  if (!rates?.length) return null;
  const sorted = [...rates].sort((a, b) => (a.effectiveFrom < b.effectiveFrom ? -1 : 1));
  let found = sorted[0];
  for (const r of sorted) if (r.effectiveFrom <= dateISO) found = r; else break;
  return found.amount;
}

/**
 * درآمد روزمزدی = مجموع «نرخ لحظه‌ای» روزهای انجام‌شده.
 * روزهای برنامه‌ریزی‌شده/در حال انجام/لغوشده و روزهای پروژه‌های پروژه‌ای (rate=null) درآمد نیستند.
 */
function dailyIncome(workDays) {
  let sum = 0;
  for (const d of workDays) if (d.status === "done" && Number.isSafeInteger(d.rate)) sum += d.rate;
  return sum;
}

/** تعداد «روزهای کاری» = تعداد تاریخ‌های متمایز با حداقل یک کار انجام‌شده */
function countWorkingDays(workDays) {
  return new Set(workDays.filter((d) => d.status === "done").map((d) => d.date)).size;
}

/** تعداد رکوردهای انجام‌شده (هر پروژه-روز یک واحد) */
function countDoneRecords(workDays) {
  return workDays.filter((d) => d.status === "done").length;
}

return { validateCustomer, validateProject, rateForDate, dailyIncome, countWorkingDays, countDoneRecords };
},
"js/core/constants.js": () => {

  fixed: "پروژه‌ای",

const PROJECT_STATUS = {

const STATUS_TONE = {

};

const WORKDAY_STATUS = {

"js/core/jalali.js": () => {
/**
 * jalali.js — تبدیل تقویم میلادی ⇄ شمسی (جلالی) و ابزارهای تاریخ
 *
 * قرارداد: در دیتابیس تاریخ‌ها به‌صورت میلادی ISO ("YYYY-MM-DD") ذخیره می‌شوند.
 * این ماژول فقط برای تبدیل و نمایش است و هیچ وابستگی بیرونی ندارد.
 * الگوریتم: جدول شکست‌های ۳۳ساله (روش jalaali-js) با اعتبارسنجی در tests/unit.mjs
 * در برابر Intl تقویم persian برای ده‌ها هزار روز.
 */
const { toPersianDigits } = __r("js/core/money.js");

const MONTH_NAMES = [
  "فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور",
  "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند",
];
/** هفته از شنبه شروع می‌شود؛ ایندکس ۰ = شنبه */
const WEEKDAY_NAMES = ["شنبه", "یکشنبه", "دوشنبه", "سه‌شنبه", "چهارشنبه", "پنجشنبه", "جمعه"];
const WEEKDAY_SHORT = ["ش", "ی", "د", "س", "چ", "پ", "ج"];

const BREAKS = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];

const div = (a, b) => Math.trunc(a / b);
const mod = (a, b) => a - Math.trunc(a / b) * b;

function jalCal(jy) {
  const bl = BREAKS.length;
  const gy = jy + 621;
  let leapJ = -14;
  let jp = BREAKS[0];
  let jump = 0;
  if (jy < jp || jy >= BREAKS[bl - 1]) throw new RangeError("سال شمسی خارج از محدوده: " + jy);
  for (let i = 1; i < bl; i++) {
    const jm = BREAKS[i];
    jump = jm - jp;
    if (jy < jm) break;
    leapJ += div(jump, 33) * 8 + div(mod(jump, 33), 4);
    jp = jm;
  }
  let n = jy - jp;
  leapJ += div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
  if (mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
  const leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
  const march = 20 + leapJ - leapG;
  if (jump - n < 6) n = n - jump + div(jump + 4, 33) * 33;
  let leap = mod(mod(n + 1, 33) - 1, 4);
  if (leap === -1) leap = 4;
  return { leap, gy, march };
}

function g2d(gy, gm, gd) {
  let d = div((gy + div(gm - 8, 6) + 100100) * 1461, 4) + div(153 * mod(gm + 9, 12) + 2, 5) + gd - 34840408;
  d = d - div(div(gy + 100100 + div(gm - 8, 6), 100) * 3, 4) + 752;
  return d;
}

function d2g(jdn) {
  let j = 4 * jdn + 139361631;
  j = j + div(div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
  const i = div(mod(j, 1461), 4) * 5 + 308;
  const gd = div(mod(i, 153), 5) + 1;
  const gm = mod(div(i, 153), 12) + 1;
  const gy = div(j, 1461) - 100100 + div(8 - gm, 6);
  return { gy, gm, gd };
}

function j2d(jy, jm, jd) {
  const r = jalCal(jy);
  return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - div(jm, 7) * (jm - 7) + jd - 1;
}

function d2j(jdn) {
  const g = d2g(jdn);
  let jy = g.gy - 621;
  const r = jalCal(jy);
  const jdn1f = g2d(g.gy, 3, r.march);
  let k = jdn - jdn1f;
  if (k >= 0) {
    if (k <= 185) return { jy, jm: 1 + div(k, 31), jd: mod(k, 31) + 1 };
    k -= 186;
  } else {
    jy -= 1;
    k += 179;
    if (r.leap === 1) k += 1;
  }
  return { jy, jm: 7 + div(k, 30), jd: mod(k, 30) + 1 };
}

/* ---------- API عمومی ---------- */

function isJalaliLeap(jy) { return jalCal(jy).leap === 0; }

function jalaliMonthLength(jy, jm) {
  if (jm <= 6) return 31;
  if (jm <= 11) return 30;
  return isJalaliLeap(jy) ? 30 : 29;
}

function isValidJalali(jy, jm, jd) {
  return Number.isInteger(jy) && Number.isInteger(jm) && Number.isInteger(jd) &&
    jy >= -61 && jy < 3177 && jm >= 1 && jm <= 12 && jd >= 1 && jd <= jalaliMonthLength(jy, jm);
}

function toJalali(gy, gm, gd) { return d2j(g2d(gy, gm, gd)); }

function toGregorian(jy, jm, jd) {
  if (!isValidJalali(jy, jm, jd)) throw new RangeError(`تاریخ شمسی نامعتبر: ${jy}/${jm}/${jd}`);
  return d2g(j2d(jy, jm, jd));
}

const pad = (n, w = 2) => String(n).padStart(w, "0");

/** @returns {string} "YYYY-MM-DD" میلادی */
function gregorianToISO(gy, gm, gd) { return `${pad(gy, 4)}-${pad(gm)}-${pad(gd)}`; }

/** "YYYY-MM-DD" → {gy,gm,gd} (با اعتبارسنجی) */
function parseISO(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso));
  if (!m) throw new RangeError("قالب تاریخ نامعتبر: " + iso);
  const gy = +m[1], gm = +m[2], gd = +m[3];
  const d = new Date(Date.UTC(gy, gm - 1, gd));
  if (d.getUTCFullYear() !== gy || d.getUTCMonth() !== gm - 1 || d.getUTCDate() !== gd) {
    throw new RangeError("تاریخ میلادی نامعتبر: " + iso);
  }
  return { gy, gm, gd };
}

function isoToJalali(iso) {
  const { gy, gm, gd } = parseISO(iso);
  return toJalali(gy, gm, gd);
}

function jalaliToISO(jy, jm, jd) {
  const { gy, gm, gd } = toGregorian(jy, jm, jd);
  return gregorianToISO(gy, gm, gd);
}

/** تاریخ امروز (به وقت محلی دستگاه) به‌صورت ISO */
function todayISO(now = new Date()) {
  return gregorianToISO(now.getFullYear(), now.getMonth() + 1, now.getDate());
}

/** شماره روز هفته با شنبه=۰ … جمعه=۶ */
function weekdayIndex(iso) {
  const { gy, gm, gd } = parseISO(iso);
  const js = new Date(Date.UTC(gy, gm - 1, gd)).getUTCDay(); // یکشنبه=۰
  return (js + 1) % 7;
}

function addDays(iso, n) {
  const { gy, gm, gd } = parseISO(iso);
  const d = new Date(Date.UTC(gy, gm - 1, gd + n));
  return gregorianToISO(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
}

/** اختلاف روز (b − a) */
function diffDays(aISO, bISO) {
  const a = parseISO(aISO), b = parseISO(bISO);
  return Math.round((Date.UTC(b.gy, b.gm - 1, b.gd) - Date.UTC(a.gy, a.gm - 1, a.gd)) / 86400000);
}

/** فرمت‌ها: "numeric" → ۱۴۰۵/۰۹/۰۲ ، "long" → ۲ آذر ۱۴۰۵ ، "full" → دوشنبه ۲ آذر ۱۴۰۵ */
function formatJalali(iso, style = "numeric") {
  if (!iso) return "";
  const j = isoToJalali(iso);
  if (style === "numeric") return toPersianDigits(`${j.jy}/${pad(j.jm)}/${pad(j.jd)}`);
  const base = `${j.jd} ${MONTH_NAMES[j.jm - 1]} ${j.jy}`;
  if (style === "long") return toPersianDigits(base);
  return `${WEEKDAY_NAMES[weekdayIndex(iso)]} ${toPersianDigits(base)}`;
}

/** تاریخ شمسی تایپ‌شده (۱۴۰۵/۹/۲ با هر نوع رقم) → ISO میلادی؛ در صورت نامعتبر بودن null */
function parseJalaliInput(text) {
  const s = String(text ?? "")
    .replace(/[۰-۹]/g, (c) => String(c.charCodeAt(0) - 0x06f0))
    .replace(/[٠-٩]/g, (c) => String(c.charCodeAt(0) - 0x0660))
    .trim();
  const m = /^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/.exec(s);
  if (!m) return null;
  const [jy, jm, jd] = [+m[1], +m[2], +m[3]];
  if (!isValidJalali(jy, jm, jd)) return null;
  return jalaliToISO(jy, jm, jd);
}

/** شروع و پایان ماه شمسی به‌صورت ISO میلادی */
function jalaliMonthRange(jy, jm) {
  return { start: jalaliToISO(jy, jm, 1), end: jalaliToISO(jy, jm, jalaliMonthLength(jy, jm)) };
}

/** شروع و پایان سال شمسی به‌صورت ISO میلادی */
function jalaliYearRange(jy) {
  return { start: jalaliToISO(jy, 1, 1), end: jalaliToISO(jy, 12, jalaliMonthLength(jy, 12)) };
}

/** ماه جاری شمسی بر اساس امروز */
function currentJalaliMonth(now = new Date()) {
  const j = isoToJalali(todayISO(now));
  return { jy: j.jy, jm: j.jm };
}

return { MONTH_NAMES, WEEKDAY_NAMES, WEEKDAY_SHORT, isJalaliLeap, jalaliMonthLength, isValidJalali, toJalali, toGregorian, gregorianToISO, parseISO, isoToJalali, jalaliToISO, todayISO, weekdayIndex, addDays, diffDays, formatJalali, parseJalaliInput, jalaliMonthRange, jalaliYearRange, currentJalaliMonth };
},
"js/core/dataset.js": () => {
/** dataset.js — خواندن یکجای همه داده‌ها در یک تراکنش خواندنی (برای گزارش/داشبورد/مالی) */
const { withTx } = __r("js/core/db.js");

const STORES = ["customers", "projects", "workDays", "payments", "expenses", "followups", "dailyRates"];

async function loadDataset() {
  return withTx(STORES, "readonly", async (s) => {
    const out = {};
    for (const n of STORES) out[n] = await s[n].getAll();
    return out;
  });
}

/** آخرین n رویداد از سوابق فعالیت (جدیدترین اول) */
function recentActivity(n = 10) {
  return withTx("activity", "readonly", (s) => new Promise((resolve, reject) => {
    const out = [];
    const req = s.activity.raw.index("at").openCursor(null, "prev");
    req.onsuccess = () => {
      const c = req.result;
      if (c && out.length < n) { out.push(c.value); c.continue(); } else resolve(out);
    };
    req.onerror = () => reject(req.error);
  }));
}

return { loadDataset, recentActivity };
},
"js/core/reports.js": () => {
/**
 * reports.js — گزارش‌ها و داده‌های داشبورد (خالص؛ ورودی = dataset).
 * قواعد:
 *  - درآمد روزمزدی: روزهای «انجام‌شده» در بازه (نرخ لحظه‌ای)
 *  - درآمد پروژه‌ای: مبلغ قرارداد، «یک‌بار» در تاریخ پایان واقعی پروژه تکمیل‌شده
 *  - پول دریافت‌شده: پرداخت‌های kind=payment باطل‌نشده بر اساس تاریخ دریافت
 *  - بازپرداخت هزینه: جدا گزارش می‌شود، نه درآمد است نه از مانده کم می‌کند
 *  - هزینه‌ها: بر اساس تاریخ خرید. «سود پس از هزینه‌های ثبت‌شده» سود خالص حسابداری نیست.
 */
const { dailyIncome, countWorkingDays } = __r("js/core/rules.js");
const { projectFinance, validPayments, receivablesByCustomer, completedUnsettled, overdueFollowups, totalReceivable } = __r("js/core/finance.js");
const { jalaliMonthRange, jalaliYearRange, isoToJalali, diffDays } = __r("js/core/jalali.js");

const inRange = (d, from, to) => d && d >= from && d <= to;
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
const minISO = (a, b) => (a < b ? a : b);

function periodReport(ds, from, to, today) {
  const days = ds.workDays.filter((w) => w.status === "done" && inRange(w.date, from, to));
  const dailyEarned = dailyIncome(days);
  const completedInRange = ds.projects.filter((p) => p.status === "completed" && inRange(p.actualEndDate, from, to));
  const fixedEarned = sum(completedInRange.filter((p) => p.type === "fixed"), (p) => p.contractAmount ?? 0);
  const pays = validPayments(ds.payments).filter((p) => inRange(p.date, from, to));
  const received = sum(pays.filter((p) => p.kind === "payment"), (p) => p.amount);
  const refunds = sum(pays.filter((p) => p.kind === "expense_refund"), (p) => p.amount);
  const expenses = sum(ds.expenses.filter((e) => inRange(e.date, from, to)), (e) => e.amount);
  const asOf = minISO(to, today);
  const receivable = sum(ds.projects, (p) => projectFinance(p, ds.workDays, ds.payments, { asOf }).remaining);
  const earned = dailyEarned + fixedEarned;
  return {
    from, to,
    earned, dailyEarned, fixedEarned,
    received, refunds, receivable,
    expenses, profitAfterExpenses: earned - expenses,
    workingDays: countWorkingDays(days),
    completedProjects: completedInRange.length,
    unfinishedProjects: ds.projects.filter((p) => p.status === "active" || p.status === "paused").length,
  };
}

const monthReport = (ds, jy, jm, today) => { const r = jalaliMonthRange(jy, jm); return periodReport(ds, r.start, r.end, today); };
const yearReport = (ds, jy, today) => { const r = jalaliYearRange(jy); return periodReport(ds, r.start, r.end, today); };

/** ۱۲ ماه یک سال برای نمودار میله‌ای */
function monthsOfYear(ds, jy, today) {
  return Array.from({ length: 12 }, (_, i) => {
    const r = monthReport(ds, jy, i + 1, today);
    return { jm: i + 1, earned: r.earned, received: r.received, expenses: r.expenses };
  });
}

/** مقایسه سال‌ها: همه سال‌هایی که داده دارند */
function yearlyComparison(ds, today) {
  const years = new Set();
  const add = (iso) => iso && years.add(isoToJalali(iso).jy);
  ds.workDays.forEach((w) => w.status === "done" && add(w.date));
  validPayments(ds.payments).forEach((p) => add(p.date));
  ds.expenses.forEach((e) => add(e.date));
  ds.projects.forEach((p) => p.status === "completed" && add(p.actualEndDate));
  return [...years].sort((a, b) => a - b).map((jy) => ({ jy, ...yearReport(ds, jy, today) }));
}

/** آمار کلی از اولین روز ثبت تا تاریخ انتخابی */
function allTimeStats(ds, upTo, today) {
  const r = periodReport(ds, "0001-01-01", upTo, today);
  return {
    upTo,
    completedProjects: r.completedProjects,
    workingDays: r.workingDays,
    customers: ds.customers.filter((c) => !c.firstCollabDate || c.firstCollabDate <= upTo).length,
    dailyEarned: r.dailyEarned, fixedEarned: r.fixedEarned,
    received: r.received, receivable: r.receivable,
    unfinishedProjects: r.unfinishedProjects,
    expenses: r.expenses, profitAfterExpenses: r.profitAfterExpenses, refunds: r.refunds,
  };
}

/** داده‌های داشبورد */
function dashboardData(ds, today, jy, jm, activity = []) {
  const m = monthReport(ds, jy, jm, today);
  const near = ds.projects
    .filter((p) => (p.status === "active" || p.status === "planned") && p.expectedEndDate && diffDays(today, p.expectedEndDate) <= 7)
    .map((p) => ({ project: p, daysLeft: diffDays(today, p.expectedEndDate) }))
    .sort((a, b) => a.daysLeft - b.daysLeft);
  const activeCustomers = new Set(ds.projects.filter((p) => p.status === "active" || p.status === "planned").map((p) => p.customerId)).size;
  return {
    monthEarned: m.earned, monthReceived: m.received, monthWorkingDays: m.workingDays,
    totalReceivable: totalReceivable(ds, today),
    runningProjects: ds.projects.filter((p) => p.status === "active").length,
    completedProjects: ds.projects.filter((p) => p.status === "completed").length,
    activeCustomers,
    nearEnd: near,
    completedUnsettled: completedUnsettled(ds),
    overdueFollowups: overdueFollowups(ds, today),
    recentActivity: [...activity].sort((a, b) => (a.at < b.at ? 1 : -1)).slice(0, 10),
    receivableRows: receivablesByCustomer(ds, today),
  };
}

return { periodReport, monthReport, yearReport, monthsOfYear, yearlyComparison, allTimeStats, dashboardData };
},
"js/core/backup.js": () => {
/**
 * backup.js — پشتیبان‌گیری و بازیابی (واقع‌بینانه؛ محدودیت‌های Chrome اندروید در USER_GUIDE.md)
 *
 * لایه ۱ (داخلی): اسنپ‌شات خودکار داخل خود برنامه (حداکثر روزی یک‌بار هنگام باز شدن)؛
 *   از خطای کاربر/خرابی داده محافظت می‌کند، ولی «پاک شدن داده‌های Chrome» را پوشش نمی‌دهد.
 * لایه ۲ (بیرونی): هر ≥۷ روز، هنگام باز شدن برنامه، دانلود خودکار فایل JSON به پوشه Downloads.
 *   اندروید اجازه‌ی اجرا در پس‌زمینه/وقتی Chrome بسته است را نمی‌دهد؛ بنابراین فقط «هنگام باز بودن برنامه» اجرا می‌شود
 *   و Chrome ممکن است دانلود را مسدود کند؛ برای همین بعدش از کاربر یک‌بار تأیید گرفته می‌شود.
 */
const { withTx, getMeta, setMeta, logActivity } = __r("js/core/db.js");
const { DATA_STORES, DB_VERSION } = __r("js/core/schema.js");
const { makeBackupObject, validateBackup, backupFileName } = __r("js/core/backupFormat.js");
const { AppError } = __r("js/core/util.js");
const { formatJalali, todayISO } = __r("js/core/jalali.js");
const { toEnglishDigits } = __r("js/core/money.js");

const DAY = 86400000;
const KEEP_AUTO = 10, KEEP_PRE_RESTORE = 3;

async function readAllData() {
  return withTx(DATA_STORES, "readonly", async (s) => {
    const data = {};
    for (const n of DATA_STORES) data[n] = await s[n].getAll();
    return data;
  });
}

const hasAnyData = (data) => Object.values(data).some((a) => a.length > 0);

async function buildBackup(now = new Date()) {
  return makeBackupObject(await readAllData(), { schemaVersion: DB_VERSION, now });
}

/* ---------------- اسنپ‌شات داخلی ---------------- */
async function saveSnapshot(kind = "auto", now = new Date()) {
  const obj = await buildBackup(now);
  const json = JSON.stringify(obj);
  await withTx("backups", "readwrite", async (s) => {
    await s.backups.add({ kind, createdAt: now.toISOString(), schemaVersion: obj.schemaVersion, counts: obj.counts, size: json.length, json });
    const all = (await s.backups.getAll()).sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
    const autos = all.filter((b) => b.kind !== "pre-restore");
    const pres = all.filter((b) => b.kind === "pre-restore");
    for (const b of [...autos.slice(KEEP_AUTO), ...pres.slice(KEEP_PRE_RESTORE)]) await s.backups.delete(b.id);
  });
  return obj;
}

async function listSnapshots() {
  const rows = await withTx("backups", "readonly", (s) => s.backups.getAll());
  return rows.map(({ json, ...meta }) => meta).sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
}

async function getSnapshotObject(id) {
  const row = await withTx("backups", "readonly", (s) => s.backups.get(id));
  if (!row) throw new AppError("not-found", "این نسخه‌ی داخلی پیدا نشد.");
  return JSON.parse(row.json);
}

/* ---------------- بازیابی ---------------- */
const put = (store, rec) => new Promise((res, rej) => { const r = store.raw.put(rec); r.onsuccess = () => res(); r.onerror = () => rej(r.error); });

/** بررسی فایل بدون هیچ تغییری روی داده‌ها */
function checkBackup(obj) {
  return validateBackup(obj, { maxSchemaVersion: DB_VERSION, requiredStores: DATA_STORES });
}

/**
 * جایگزینی کل داده‌ها با بکاپ، در «یک» تراکنش (یا کامل انجام می‌شود یا هیچ تغییری نمی‌کند).
 * قبل از آن یک اسنپ‌شات «pre-restore» از وضعیت فعلی ذخیره می‌شود تا بازیابی اشتباه قابل برگشت باشد.
 */
async function restoreBackup(obj) {
  const v = await checkBackup(obj);
  if (!v.ok) throw new AppError("bad-backup", v.error);
  const current = await readAllData();
  if (hasAnyData(current)) await saveSnapshot("pre-restore");
  await withTx(DATA_STORES, "readwrite", async (s) => {
    for (const n of DATA_STORES) await s[n].clear();
    for (const n of DATA_STORES) for (const rec of obj.data[n]) await put(s[n], rec);
    await logActivity(s, { entity: "backup", entityId: 0, action: "restore", summary: `بازیابی از بکاپ ${formatJalali(obj.createdAt.slice(0, 10), "long")}` });
  });
  return obj.counts;
}

/* ---------------- دانلود فایل بیرونی ---------------- */
function jalaliStamp(now = new Date()) {
  return toEnglishDigits(formatJalali(todayISO(now), "numeric")).replaceAll("/", "-");
}

function downloadBackupFile(obj, now = new Date()) {
  const blob = new Blob([JSON.stringify(obj)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = backupFileName(jalaliStamp(now));
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

/* ---------------- بکاپ خودکار هنگام باز شدن برنامه ---------------- */
const getBackupState = () => getMeta("backupState", { lastSnapshotAt: null, lastExternalAt: null, pendingConfirm: false, confirmedAt: null });

/**
 * فقط هنگام اجرای برنامه صدا زده می‌شود. هرگز ادعا نمی‌کند که وقتی Chrome بسته است کاری انجام می‌شود.
 * @returns {Promise<{snapshot: boolean, external: boolean}>}
 */
async function maybeAutoBackup({ now = new Date(), download = true } = {}) {
  const data = await readAllData();
  const result = { snapshot: false, external: false };
  if (!hasAnyData(data)) return result;
  const st = await getBackupState();
  const t = now.getTime();
  if (!st.lastSnapshotAt || t - Date.parse(st.lastSnapshotAt) >= DAY) {
    await saveSnapshot("auto", now);
    st.lastSnapshotAt = now.toISOString(); result.snapshot = true;
  }
  if (!st.lastExternalAt || t - Date.parse(st.lastExternalAt) >= 7 * DAY) {
    if (download) {
      downloadBackupFile(await makeBackupObject(data, { schemaVersion: DB_VERSION, now }), now);
      st.lastExternalAt = now.toISOString(); st.pendingConfirm = true; result.external = true;
    }
  }
  await setMeta("backupState", st);
  return result;
}

async function confirmExternalBackup(now = new Date()) {
  const st = await getBackupState();
  st.pendingConfirm = false; st.confirmedAt = now.toISOString();
  await setMeta("backupState", st);
}

/** دانلود مجدد (بعد از اینکه کاربر گفت فایل ذخیره نشد) */
async function redownloadBackup(now = new Date()) {
  const st = await getBackupState();
  downloadBackupFile(await buildBackup(now), now);
  st.lastExternalAt = now.toISOString(); st.pendingConfirm = true;
  await setMeta("backupState", st);
}

return { readAllData, hasAnyData, buildBackup, saveSnapshot, listSnapshots, getSnapshotObject, checkBackup, restoreBackup, jalaliStamp, downloadBackupFile, getBackupState, maybeAutoBackup, confirmExternalBackup, redownloadBackup };
},
"js/core/backupFormat.js": () => {
/**
 * backupFormat.js — ساختار و اعتبارسنجی فایل پشتیبان (خالص، قابل تست در Node)
 *
 * { app, formatVersion, schemaVersion, createdAt, counts, checksum, data: { [store]: record[] } }
 * - formatVersion: ساختار خودِ فایل (اگر بزرگ‌تر از نسخه‌ی پشتیبانی‌شده باشد، رد می‌شود)
 * - schemaVersion: نسخه‌ی دیتابیسِ هنگام ساخت (بکاپِ نسخه‌ی جدیدتر روی برنامه‌ی قدیمی‌تر رد می‌شود)
 * - checksum: SHA-256 روی data برای تشخیص فایل خراب/ناقص
 */
const APP_ID = "personal-contractor-manager";
const FORMAT_VERSION = 1;

async function sha256Hex(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

const countRecords = (data) => Object.fromEntries(Object.entries(data).map(([k, v]) => [k, v.length]));

async function makeBackupObject(data, { schemaVersion, now = new Date() }) {
  return {
    app: APP_ID, formatVersion: FORMAT_VERSION, schemaVersion,
    createdAt: now.toISOString(),
    counts: countRecords(data),
    checksum: await sha256Hex(JSON.stringify(data)),
    data,
  };
}

/**
 * @returns {Promise<{ok: boolean, error?: string}>}
 * requiredStores: فروشگاه‌های داده‌ای که باید در فایل باشند
 */
async function validateBackup(obj, { maxSchemaVersion, requiredStores }) {
  const bad = (error) => ({ ok: false, error });
  if (!obj || typeof obj !== "object" || obj.app !== APP_ID) return bad("این فایل، فایل پشتیبان این برنامه نیست.");
  if (!Number.isInteger(obj.formatVersion) || obj.formatVersion < 1) return bad("ساختار فایل پشتیبان نامعتبر است.");
  if (obj.formatVersion > FORMAT_VERSION) return bad("این فایل با نسخه‌ی جدیدتری از برنامه ساخته شده؛ ابتدا برنامه را به‌روز کنید.");
  if (!Number.isInteger(obj.schemaVersion) || obj.schemaVersion < 1) return bad("نسخه‌ی داده‌های فایل نامعتبر است.");
  if (obj.schemaVersion > maxSchemaVersion) return bad("این بکاپ از نسخه‌ی جدیدتری از دیتابیس است و با این نسخه‌ی برنامه سازگار نیست.");
  if (!obj.data || typeof obj.data !== "object") return bad("داده‌ای در فایل وجود ندارد.");
  for (const name of requiredStores) {
    if (!Array.isArray(obj.data[name])) return bad(`بخش «${name}» در فایل پیدا نشد یا خراب است.`);
  }
  for (const name of Object.keys(obj.data)) {
    if (!requiredStores.includes(name)) return bad(`بخش ناشناخته «${name}» در فایل وجود دارد.`);
    if (obj.data[name].some((r) => r === null || typeof r !== "object")) return bad(`رکورد نامعتبر در «${name}».`);
  }
  if ((await sha256Hex(JSON.stringify(obj.data))) !== obj.checksum) return bad("فایل خراب یا دستکاری شده است (کد صحت داده‌ها نمی‌خواند).");

  // یکپارچگی ارتباط‌ها
  const ids = (n) => new Set(obj.data[n].map((r) => r.id));
  const customers = ids("customers"), projects = ids("projects");
  for (const p of obj.data.projects) if (!customers.has(p.customerId)) return bad("پروژه‌ای به مشتری ناموجود اشاره می‌کند؛ فایل ناسازگار است.");
  for (const n of ["workDays", "payments", "expenses", "dailyRates"]) {
    for (const r of obj.data[n]) if (!projects.has(r.projectId)) return bad(`رکوردی در «${n}» به پروژه‌ی ناموجود اشاره می‌کند؛ فایل ناسازگار است.`);
  }
  return { ok: true };
}

/** نام فایل پیشنهادی: pcm-backup-YYYY-MM-DD.json */
const backupFileName = (jalaliText) => `pcm-backup-${jalaliText}.json`;

return { APP_ID, FORMAT_VERSION, sha256Hex, countRecords, makeBackupObject, validateBackup, backupFileName };
},

"js/ui/modal.js": () => {
/** modal.js — پنجره‌های پایین‌صفحه (Bottom Sheet) و تأییدیه */
const { h } = __r("js/ui/dom.js");

let openCount = 0;

/**
 * نمایش یک sheet. محتوا یک Node است.
 * @returns {{close: (result?: any) => void, el: HTMLElement, closed: Promise<any>}}
 */
function openSheet(content, { dismissible = true } = {}) {
  const prevFocus = document.activeElement;
  const sheet = h("div", { class: "sheet", role: "dialog", "aria-modal": "true" }, h("div", { class: "sheet__grip" }), content);
  const overlay = h("div", { class: "overlay" }, sheet);
  let resolve;
  const closed = new Promise((r) => (resolve = r));
  let done = false;

  const close = (result) => {
    if (done) return;
    done = true;
    document.removeEventListener("keydown", onKey);
    overlay.classList.add("is-closing");
    setTimeout(() => {
      overlay.remove();
      if (--openCount === 0) document.body.style.removeProperty("pointer-events");
      prevFocus?.focus?.();
      resolve(result);
    }, 150);
  };
  const onKey = (e) => { if (e.key === "Escape" && dismissible) close(undefined); };

  if (dismissible) overlay.addEventListener("pointerdown", (e) => { if (e.target === overlay) close(undefined); });
  document.addEventListener("keydown", onKey);
  document.body.append(overlay);
  openCount++;
  queueMicrotask(() => sheet.querySelector("input,select,textarea,button.btn")?.focus?.({ preventScroll: true }));
  return { close, el: sheet, closed };
}

/**
 * تأیید قبل از عملیات حساس (حذف و...). resolves → true/false
 */
function confirmDialog({ title, text, confirmLabel = "تأیید", cancelLabel = "انصراف", danger = false }) {
  return new Promise((resolve) => {
    const ctl = openSheet(
      h("div", null,
        h("h3", { class: "sheet__title" }, title),
        text ? h("p", { class: "sheet__text" }, text) : null,
        h("div", { class: "sheet__actions" },
          h("button", { type: "button", class: "btn btn--ghost", onClick: () => ctl.close(false) }, cancelLabel),
          h("button", { type: "button", class: "btn " + (danger ? "btn--danger" : "btn--primary"), onClick: () => ctl.close(true) }, confirmLabel),
        ),
      ),
    );
    ctl.closed.then((v) => resolve(v === true));
  });
}

return { openSheet, confirmDialog };
},
